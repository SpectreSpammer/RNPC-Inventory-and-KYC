spring.application.name=inventory
# Railway (and most PaaS hosts) assign the port to listen on via the PORT env var and route
# external traffic to it - falls back to 9090 for local dev, where nothing sets PORT.
server.port=${PORT:9090}

# Real secrets (API keys) live in application-secrets.properties, which is gitignored and
# never committed. This import is optional so the app still starts if that file is missing.
spring.config.import=optional:classpath:application-secrets.properties
xendit.api.key=
xendit.base-url=https://api.xendit.co

# Falls back to local XAMPP MariaDB (localhost/root/no password) when these env vars aren't
# set. Railway's MySQL plugin auto-injects MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/
# MYSQLPASSWORD into every service in the same project once a MySQL database is added there -
# same properties file works unmodified in both places.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rnpc}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.mvc.hiddenmethod.filter.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB