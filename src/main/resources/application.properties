spring.application.name=inventory
# Railway (and most PaaS hosts) assign the port to listen on via the PORT env var and route
# external traffic to it - falls back to 9090 for local dev, where nothing sets PORT.
server.port=${PORT:9090}

# Railway (and most PaaS hosts) terminate HTTPS at their edge and forward to the app over plain
# HTTP internally, adding X-Forwarded-Proto/X-Forwarded-Host headers with the original request's
# real scheme/host. Without this, Spring never sees those headers and builds URLs (notably the
# Google OAuth2 redirect_uri) as http://, which Google then rejects as a mismatch against the
# https:// URI actually registered for this app.
server.forward-headers-strategy=framework

# Always show Google's account chooser instead of silently reusing the current session
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account

# Real secrets (API keys) live in application-secrets.properties, which is gitignored and
# never committed. This import is optional so the app still starts if that file is missing.
spring.config.import=optional:classpath:application-secrets.properties
xendit.api.key=
xendit.base-url=https://api.xendit.co

# Falls back to local XAMPP MariaDB (localhost/root/no password) when these env vars aren't
# set. Railway's MySQL plugin auto-injects MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/
# MYSQLPASSWORD into every service in the same project once a MySQL database is added there -
# same properties file works unmodified in both places.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:rnpc}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Still logs to the console too (Spring Boot's default when logging.file.name is set) - this just
# also captures it to a file so a stack trace (e.g. a Thymeleaf rendering exception mid-response)
# can be read after the fact, from a terminal/IDE console nobody has open.
logging.file.name=logs/app.log

spring.mvc.hiddenmethod.filter.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB