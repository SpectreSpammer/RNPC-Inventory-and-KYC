<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  The mockup has no empty-state example to convert faithfully - built to match its established
  visual language (theme.css vars, card spacing/radius) since this is used for real cards this
  page turned out to have no data for (see chat).
  Params: icon (Feather icon name, nullable - defaults to "inbox"), message (String),
          actions (fragment expression, nullable)
  Usage:
    <div th:replace="~{fragments/empty-state :: state(icon='shopping-cart', message='No orders yet', actions=~{::#emptyOrdersActions})}"></div>
    <div id="emptyOrdersActions" hidden><a href="/build" class="btn-accent-sm">Build a PC</a></div>
-->
<div th:fragment="state(icon, message, actions)" class="empty-state">
    <i th:attr="data-feather=${icon != null and !#strings.isEmpty(icon)} ? ${icon} : 'inbox'" class="empty-state-icon"></i>
    <p class="empty-state-message" th:text="${message}"></p>
    <th:block th:if="${actions != null}">
        <div th:replace="${actions}" class="empty-state-actions"></div>
    </th:block>
</div>

<style th:fragment="empty-state-styles">
    .empty-state{ text-align:center; padding:var(--space-6) var(--space-4); color:var(--text-muted); }
    .empty-state-icon{ width:36px; height:36px; color:var(--border); margin-bottom:var(--space-3); }
    .empty-state-message{ font-size:13.5px; font-weight:600; color:var(--text); margin:0 0 var(--space-3); }
    .empty-state-actions{ display:flex; justify-content:center; gap:var(--space-2); }
</style>

</body>
</html>
