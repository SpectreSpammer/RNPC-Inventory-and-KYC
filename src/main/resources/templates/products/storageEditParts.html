<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit Storage - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Edit form for Storage - same shape as its create page, differing only in the action, the
  _method=put field, the photo section and the save label. VISUAL CONVERSION ONLY; the
  removePhoto behaviour is exactly as before, X-Requested-With header and res.ok check
  included (see fragments/parts-form :: remove-photo-script). This page previously had no
  shell at all - no sidebar, no topbar, just a centered Bootstrap form.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='pc-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='STO', title=${#strings.isEmpty(storagePartsDto.modelName) ? 'Edit Storage' : 'Edit ' + storagePartsDto.modelName}, subtitle='Changes apply to the parts list and PC builder as soon as you save.', backUrl=@{/computer(category='Storage')})}"></div>

            <form th:action="@{/storage/update/{id}(id=${partId})}" th:object="${storagePartsDto}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="_method" value="put"/>
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>Storage details</h2>
                        <div class="pf-grid">

                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">-- Select Brand --</option>
                                    <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="modelName">Model</label>
                                <input type="text" th:field="*{modelName}" id="modelName"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="category">Category</label>
                                <select th:field="*{category}" id="category">
                                    <option value="">-- Select Category --</option>
                                    <option th:each="opt : ${categoryOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="formFactor">Form Factor</label>
                                <select th:field="*{formFactor}" id="formFactor">
                                    <option value="">-- Select Form Factor --</option>
                                    <option th:each="opt : ${formFactorOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('formFactor')}" th:errors="*{formFactor}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="interfaceType">Interface</label>
                                <input type="text" th:field="*{interfaceType}" id="interfaceType"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('interfaceType')}" th:errors="*{interfaceType}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="capacities">Capacities</label>
                                <input type="text" th:field="*{capacities}" id="capacities"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('capacities')}" th:errors="*{capacities}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="seqReadMbs">Seq. Read(MB/s)</label>
                                <input type="number" th:field="*{seqReadMbs}" id="seqReadMbs"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('seqReadMbs')}" th:errors="*{seqReadMbs}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="seqWriteMbs">Seq. Write(MB/s)</label>
                                <input type="number" th:field="*{seqWriteMbs}" id="seqWriteMbs"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('seqWriteMbs')}" th:errors="*{seqWriteMbs}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="dramCache">DRAM Cache</label>
                                <select th:field="*{dramCache}" id="dramCache">
                                    <option value="">-- Select DRAM Cache --</option>
                                    <option th:each="opt : ${dramCacheOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('dramCache')}" th:errors="*{dramCache}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="warranty">Warranty</label>
                                <input type="text" th:field="*{warranty}" id="warranty"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('warranty')}" th:errors="*{warranty}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="typicalUse">Typical Use</label>
                                <input type="text" th:field="*{typicalUse}" id="typicalUse"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('typicalUse')}" th:errors="*{typicalUse}"></span>
                            </div>

                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-hint">Shown to customers at checkout.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong th:text="${currentImage} ? 'Replace the current photo' : 'Choose a photo for this part'"></strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                        <th:block th:if="${currentImage}">
                            <div th:replace="~{fragments/parts-form :: current-photo(currentImage=${currentImage}, removeUrl=@{/storage/removePhoto/{id}(id=${partId})})}"></div>
                        </th:block>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/computer(category='Storage')}, saveLabel='Save changes')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<script th:replace="~{fragments/parts-form :: remove-photo-script}"></script>
</body>
</html>
