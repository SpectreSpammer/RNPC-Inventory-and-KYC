<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Edit Storage</h1>
    <form th:action="@{/storage/update/{id}(id=${partId})}" th:object="${storagePartsDto}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="_method" value="put"/>

        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <select th:field="*{brand}" class="form-select" id="brand">
                <option value="">-- Select Brand --</option>
                <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
        </div>

        <div class="mb-3">
            <label for="modelName" class="form-label">Model</label>
            <input type="text" th:field="*{modelName}" class="form-control" id="modelName">
            <div class="text-danger" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select th:field="*{category}" class="form-select" id="category">
                <option value="">-- Select Category --</option>
                <option th:each="opt : ${categoryOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <div class="mb-3">
            <label for="formFactor" class="form-label">Form Factor</label>
            <select th:field="*{formFactor}" class="form-select" id="formFactor">
                <option value="">-- Select Form Factor --</option>
                <option th:each="opt : ${formFactorOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('formFactor')}" th:errors="*{formFactor}"></div>
        </div>

        <div class="mb-3">
            <label for="interfaceType" class="form-label">Interface</label>
            <input type="text" th:field="*{interfaceType}" class="form-control" id="interfaceType">
            <div class="text-danger" th:if="${#fields.hasErrors('interfaceType')}" th:errors="*{interfaceType}"></div>
        </div>

        <div class="mb-3">
            <label for="capacities" class="form-label">Capacities</label>
            <input type="text" th:field="*{capacities}" class="form-control" id="capacities">
            <div class="text-danger" th:if="${#fields.hasErrors('capacities')}" th:errors="*{capacities}"></div>
        </div>

        <div class="mb-3">
            <label for="seqReadMbs" class="form-label">Seq. Read(MB/s)</label>
            <input type="number" th:field="*{seqReadMbs}" class="form-control" id="seqReadMbs">
            <div class="text-danger" th:if="${#fields.hasErrors('seqReadMbs')}" th:errors="*{seqReadMbs}"></div>
        </div>

        <div class="mb-3">
            <label for="seqWriteMbs" class="form-label">Seq. Write(MB/s)</label>
            <input type="number" th:field="*{seqWriteMbs}" class="form-control" id="seqWriteMbs">
            <div class="text-danger" th:if="${#fields.hasErrors('seqWriteMbs')}" th:errors="*{seqWriteMbs}"></div>
        </div>

        <div class="mb-3">
            <label for="dramCache" class="form-label">DRAM Cache</label>
            <select th:field="*{dramCache}" class="form-select" id="dramCache">
                <option value="">-- Select DRAM Cache --</option>
                <option th:each="opt : ${dramCacheOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('dramCache')}" th:errors="*{dramCache}"></div>
        </div>

        <div class="mb-3">
            <label for="warranty" class="form-label">Warranty</label>
            <input type="text" th:field="*{warranty}" class="form-control" id="warranty">
            <div class="text-danger" th:if="${#fields.hasErrors('warranty')}" th:errors="*{warranty}"></div>
        </div>

        <div class="mb-3">
            <label for="typicalUse" class="form-label">Typical Use</label>
            <input type="text" th:field="*{typicalUse}" class="form-control" id="typicalUse">
            <div class="text-danger" th:if="${#fields.hasErrors('typicalUse')}" th:errors="*{typicalUse}"></div>
        </div>

        <div class="mb-3">
            <label for="stocks" class="form-label">Stocks</label>
            <input type="number" th:field="*{stocks}" class="form-control" id="stocks">
            <div class="text-danger" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <div class="input-group">
                <span class="input-group-text">Php</span>
                <input type="number" th:field="*{price}" class="form-control" id="price" step="0.01" min="0">
            </div>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Image <span class="text-muted">(optional)</span></label>
            <input type="file" th:field="*{imageFile}" class="form-control" id="imageFile">
            <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
            <div th:if="${currentImage}" class="mt-2">
                <img th:src="@{/images/{imageFileName}(imageFileName=${currentImage})}"
                     class="img-fluid d-block mb-2" width="180px"/>
                <button type="button" class="btn btn-outline-danger btn-sm remove-photo-btn"
                        th:attr="data-remove-url=@{/storage/removePhoto/{id}(id=${partId})}">
                    Remove Photo
                </button>
            </div>
        </div>

        <div class="row">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" th:href="@{/computer(category='Storage')}" role="button">Cancel</a>
            </div>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.remove-photo-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (!confirm('Remove the current photo?')) return;
                fetch(btn.dataset.removeUrl, { method: 'DELETE' })
                    .then(function() { window.location.reload(); });
            });
        });
    });
</script>
</body>
</html>
