<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
</head>
<body>
<div class="container">
    <a href="/">
        <h1 class="text-center my-4">Add GPU</h1>
    </a>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>
    <form action="#" th:action="@{/gpu/create}" th:object="${gpuPartsDto}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <input type="text" th:field="*{brand}" class="form-control" id="brand" placeholder="e.g. NVIDIA, AMD, Intel">
            <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
        </div>

        <div class="mb-3">
            <label for="series" class="form-label">Series</label>
            <input type="text" th:field="*{series}" class="form-control" id="series" placeholder="e.g. GeForce RTX 40">
            <div class="text-danger" th:if="${#fields.hasErrors('series')}" th:errors="*{series}"></div>
        </div>

        <div class="mb-3">
            <label for="modelName" class="form-label">Model</label>
            <input type="text" th:field="*{modelName}" class="form-control" id="modelName" placeholder="e.g. RTX 4070">
            <div class="text-danger" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
        </div>

        <div class="mb-3">
            <label for="architecture" class="form-label">Architecture</label>
            <input type="text" th:field="*{architecture}" class="form-control" id="architecture" placeholder="e.g. Ada Lovelace (AD104)">
            <div class="text-danger" th:if="${#fields.hasErrors('architecture')}" th:errors="*{architecture}"></div>
        </div>

        <div class="mb-3">
            <label for="vram" class="form-label">VRAM</label>
            <input type="text" th:field="*{vram}" class="form-control" id="vram" placeholder="e.g. 12 GB">
            <div class="text-danger" th:if="${#fields.hasErrors('vram')}" th:errors="*{vram}"></div>
        </div>

        <div class="mb-3">
            <label for="memoryType" class="form-label">Memory Type</label>
            <input type="text" th:field="*{memoryType}" class="form-control" id="memoryType" placeholder="e.g. GDDR6X">
            <div class="text-danger" th:if="${#fields.hasErrors('memoryType')}" th:errors="*{memoryType}"></div>
        </div>

        <div class="mb-3">
            <label for="recommendedPsuW" class="form-label">Recommended PSU</label>
            <input type="number" th:field="*{recommendedPsuW}" class="form-control" id="recommendedPsuW">
            <div class="text-danger" th:if="${#fields.hasErrors('recommendedPsuW')}" th:errors="*{recommendedPsuW}"></div>
        </div>

        <div class="mb-3">
            <label for="powerConnector" class="form-label">Power Connector</label>
            <input type="text" th:field="*{powerConnector}" class="form-control" id="powerConnector" placeholder="e.g. 1x 16-pin">
            <div class="text-danger" th:if="${#fields.hasErrors('powerConnector')}" th:errors="*{powerConnector}"></div>
        </div>

        <div class="mb-3">
            <label for="typicalAibPartners" class="form-label">Typical AIB Partners</label>
            <input type="text" th:field="*{typicalAibPartners}" class="form-control" id="typicalAibPartners" placeholder="e.g. ASUS, MSI, Gigabyte">
            <div class="text-danger" th:if="${#fields.hasErrors('typicalAibPartners')}" th:errors="*{typicalAibPartners}"></div>
        </div>

        <div class="mb-3">
            <label for="launchYear" class="form-label">Launch Year</label>
            <input type="number" th:field="*{launchYear}" class="form-control" id="launchYear">
            <div class="text-danger" th:if="${#fields.hasErrors('launchYear')}" th:errors="*{launchYear}"></div>
        </div>

        <div class="mb-3">
            <label for="stocks" class="form-label">Stocks</label>
            <input type="number" th:field="*{stocks}" class="form-control" id="stocks" placeholder="Enter stocks">
            <div class="text-danger" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <div class="input-group">
                <span class="input-group-text">Php</span>
                <input type="number" th:field="*{price}" class="form-control" id="price" placeholder="Enter price" step="0.01" min="0">
            </div>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Image <span class="text-muted">(optional)</span></label>
            <input type="file" th:field="*{imageFile}" class="form-control" id="imageFile">
            <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
        </div>

        <div class="row">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" href="/computer" role="button">Cancel</a>
            </div>
        </div>

    </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>
</body>
</html>
