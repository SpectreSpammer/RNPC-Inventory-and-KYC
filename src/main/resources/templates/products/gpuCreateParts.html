<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add GPU - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Create form for GPU, following the converted CPU pair. VISUAL CONVERSION ONLY: the entity,
  DTO, controller, URLs, field names, validation and dropdowns are untouched. Every field the
  old Bootstrap form had is still here with the same th:field, and every select is still fed
  by the same option list the controller supplies. Shared chrome comes from
  fragments/parts-form.html; the field markup stays here, explicit, with its own th:field.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='pc-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='GPU', title='Add GPU', subtitle='Fields marked optional can be filled in later.', backUrl=@{/computer(category='GPU')})}"></div>

            <form action="#" th:action="@{/gpu/create}" th:object="${gpuPartsDto}" method="post" enctype="multipart/form-data">
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>GPU details</h2>
                        <div class="pf-grid">

                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">-- Select Brand --</option>
                                    <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="series">Series</label>
                                <input type="text" th:field="*{series}" id="series" placeholder="e.g. GeForce RTX 40"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('series')}" th:errors="*{series}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="modelName">Model</label>
                                <input type="text" th:field="*{modelName}" id="modelName" placeholder="e.g. RTX 4070"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="architecture">Architecture</label>
                                <input type="text" th:field="*{architecture}" id="architecture" placeholder="e.g. Ada Lovelace (AD104)"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('architecture')}" th:errors="*{architecture}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="vram">VRAM</label>
                                <input type="text" th:field="*{vram}" id="vram" placeholder="e.g. 12 GB"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('vram')}" th:errors="*{vram}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="memoryType">Memory Type</label>
                                <select th:field="*{memoryType}" id="memoryType">
                                    <option value="">-- Select Memory Type --</option>
                                    <option th:each="opt : ${memoryTypeOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('memoryType')}" th:errors="*{memoryType}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="recommendedPsuW">Recommended PSU</label>
                                <input type="number" th:field="*{recommendedPsuW}" id="recommendedPsuW"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('recommendedPsuW')}" th:errors="*{recommendedPsuW}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="powerConnector">Power Connector</label>
                                <input type="text" th:field="*{powerConnector}" id="powerConnector" placeholder="e.g. 1x 16-pin"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('powerConnector')}" th:errors="*{powerConnector}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="typicalAibPartners">Typical AIB Partners</label>
                                <input type="text" th:field="*{typicalAibPartners}" id="typicalAibPartners" placeholder="e.g. ASUS, MSI, Gigabyte"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('typicalAibPartners')}" th:errors="*{typicalAibPartners}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="launchYear">Launch Year</label>
                                <input type="number" th:field="*{launchYear}" id="launchYear"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('launchYear')}" th:errors="*{launchYear}"></span>
                            </div>

                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks" placeholder="Enter stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" placeholder="Enter price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-hint">Shown to customers at checkout.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong>Choose a photo for this part</strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/computer(category='GPU')}, saveLabel='Save part')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
</body>
</html>
