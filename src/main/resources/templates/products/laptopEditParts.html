<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit laptop part - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Laptop edit form - same shape as laptopCreateParts.html, differing only in the action, the
  _method=put field, the photo section and the save label.

  VISUAL CONVERSION ONLY: the entity, DTO, controller, URLs, field names, validation and dropdowns
  are untouched, and the removePhoto behaviour is exactly as before, X-Requested-With header and
  res.ok check included (see fragments/parts-form :: remove-photo-script). The id attribute is
  laptopPartId, not partId as on the PC categories.

  This page previously had NO shell at all - no sidebar, no topbar, just a centered Bootstrap
  form. It now uses layout-app like every other converted page.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='laptop-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='LAP', title=${#strings.isEmpty(laptopPartsDto.partName) ? 'Edit laptop part' : 'Edit ' + laptopPartsDto.partName}, subtitle='Changes apply to the laptop parts list as soon as you save.', backUrl=@{/laptop})}"></div>

            <form th:action="@{/laptop/update/{id}(id=${laptopPartId})}" th:object="${laptopPartsDto}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="_method" value="put"/>
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>Laptop part details</h2>
                        <div class="pf-grid">

                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">Select a brand</option>
                                    <option value="Asus">Asus</option>
                                    <option value="Acer">Acer</option>
                                    <option value="Dell">Dell</option>
                                    <option value="Hp">Hp</option>
                                    <option value="Lenovo">Lenovo</option>
                                    <option value="MSI">MSI</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="partName">Part name</label>
                                <select th:field="*{partName}" id="partName">
                                    <option value="">Select a part name</option>
                                    <option value="LCD">LCD</option>
                                    <option value="Keyboard">Keyboard</option>
                                    <option value="Trackpad">Trackpad</option>
                                    <option value="Ram">Ram</option>
                                    <option value="SSD">SSD</option>
                                    <option value="M.2">M.2</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('partName')}" th:errors="*{partName}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="category">Category</label>
                                <select th:field="*{category}" id="category">
                                    <option value="">Select a category</option>
                                    <option value="Convertible">Convertible</option>
                                    <option value="Netbook">Netbook</option>
                                    <option value="Notebook">Notebook</option>
                                    <option value="Gaming Laptop">Gaming Laptop</option>
                                    <option value="Macbook">Macbook</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="storageSize">Storage size</label>
                                <select th:field="*{storageSize}" id="storageSize">
                                    <option value="">Select storage size</option>
                                    <option value="None Applicable">None Applicable</option>
                                    <option value="120 GB">120 GB</option>
                                    <option value="240 GB">240 GB</option>
                                    <option value="500 GB">500 GB</option>
                                    <option value="1 TB">1 TB</option>
                                    <option value="2 TB">2 TB</option>
                                </select>
                                <span class="pf-hint">Choose None Applicable for parts without storage.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('storageSize')}" th:errors="*{storageSize}"></span>
                            </div>

                            <div class="pf-field pf-full">
                                <label for="description">Description</label>
                                <textarea th:field="*{description}" id="description" rows="3"></textarea>
                                <span class="pf-hint">At least 10 characters.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                            </div>

                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks" placeholder="Enter stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" placeholder="Enter price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong th:text="${currentImage} ? 'Replace the current photo' : 'Choose a photo for this part'"></strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                        <th:block th:if="${currentImage}">
                            <div th:replace="~{fragments/parts-form :: current-photo(currentImage=${currentImage}, removeUrl=@{/laptop/removePhoto/{id}(id=${laptopPartId})})}"></div>
                        </th:block>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/laptop}, saveLabel='Save changes')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<script th:replace="~{fragments/parts-form :: remove-photo-script}"></script>
</body>
</html>
