<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .filter-menu, .sort-menu { min-width: 220px; padding: 0.75rem; }
        #partsTableBody tr.out-of-stock { opacity: 0.6; }
        .price-badge { font-size: 1rem; }
    </style>
</head>
<body>
<div class="container">
    <a href="/">
        <h1 class="text-center my-4">PC Parts</h1>
    </a>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>

    <div class="row mb-3 g-2 align-items-center">
        <div class="col-md-6">
            <div class="input-group rounded">
                <input type="search" class="form-control rounded" id="brandSearch" placeholder="Search by brand or model" aria-label="Search" aria-describedby="search-addon" />
                <span class="input-group-text border-0" id="search-addon">
                    <i class="fas fa-search"></i>
                </span>
            </div>
        </div>
        <div class="col-md-6 d-flex justify-content-end gap-2">
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="filterBtn" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                    Filter
                </button>
                <div class="dropdown-menu filter-menu dropdown-menu-end" aria-labelledby="filterBtn">
                    <div id="categoryChecklist"></div>
                    <button type="button" class="btn btn-primary btn-sm w-100 mt-2" id="applyFilterBtn">Apply</button>
                </div>
            </div>
            <div class="dropdown">
                <button class="btn btn-outline-secondary dropdown-toggle" type="button" id="sortBtn" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
                    Sort by
                </button>
                <div class="dropdown-menu sort-menu dropdown-menu-end" aria-labelledby="sortBtn">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sortOption" id="sortRelevance" value="relevance" checked>
                        <label class="form-check-label" for="sortRelevance">Relevance</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sortOption" id="sortPriceLow" value="priceLow">
                        <label class="form-check-label" for="sortPriceLow">Price: Low to High</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sortOption" id="sortPriceHigh" value="priceHigh">
                        <label class="form-check-label" for="sortPriceHigh">Price: High to Low</label>
                    </div>
                </div>
            </div>
            <div class="dropdown">
                <button class="btn btn-primary dropdown-toggle" type="button" id="addComponentBtn" data-bs-toggle="dropdown" aria-expanded="false">
                    Add Component
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="addComponentBtn">
                    <li><a class="dropdown-item" href="/case/create">Case</a></li>
                    <li><a class="dropdown-item" href="/cpu/create">CPU</a></li>
                    <li><a class="dropdown-item" href="/cooler/create">CPU Cooler</a></li>
                    <li><a class="dropdown-item" href="/gpu/create">GPU</a></li>
                    <li><a class="dropdown-item" href="/motherboard/create">Motherboard</a></li>
                    <li><a class="dropdown-item" href="/psu/create">PSU</a></li>
                    <li><a class="dropdown-item" href="/ram/create">RAM</a></li>
                    <li><a class="dropdown-item" href="/storage/create">Storage</a></li>
                </ul>
            </div>
        </div>
    </div>

    <table class="table" id="partsTable">
        <thead>
        <tr>
            <th>Category</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Stocks</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="partsTableBody"></tbody>
    </table>
    </main>
</div>

<!-- View modal -->
<div class="modal fade" id="viewDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="viewDetailsModalTitle">Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img id="viewDetailsImg" src="" class="img-fluid d-block mb-3" style="display:none; max-height: 260px; margin: 0 auto;" alt="Component image"/>
                <span class="badge bg-success price-badge mb-3" id="viewDetailsPrice"></span>
                <table class="table table-sm" id="viewDetailsTable">
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>

<script th:inline="javascript">
/*<![CDATA[*/
const ALL_PARTS = /*[[${parts}]]*/ [];
const ALL_CATEGORIES = (/*[[${categories}]]*/ []).slice().sort();
/*]]>*/

let activeCategories = ALL_CATEGORIES.slice();
let currentSort = 'relevance';
let searchTerm = '';

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
}

function formatPrice(value) {
    return 'Php ' + Number(value).toFixed(2);
}

function renderCategoryChecklist() {
    const container = document.getElementById('categoryChecklist');
    const isAllSelected = activeCategories.length === ALL_CATEGORIES.length;

    container.innerHTML = '<div class="form-check">' +
        '<input class="form-check-input category-radio" type="radio" name="categoryFilter" value="__ALL__" id="catAll" ' + (isAllSelected ? 'checked' : '') + '>' +
        '<label class="form-check-label" for="catAll">All</label>' +
        '</div>' +
        ALL_CATEGORIES.map(function (cat, i) {
            const checked = (!isAllSelected && activeCategories.length === 1 && activeCategories[0] === cat) ? 'checked' : '';
            return '<div class="form-check">' +
                '<input class="form-check-input category-radio" type="radio" name="categoryFilter" value="' + escapeHtml(cat) + '" id="cat' + i + '" ' + checked + '>' +
                '<label class="form-check-label" for="cat' + i + '">' + escapeHtml(cat) + '</label>' +
                '</div>';
        }).join('');
}

function getFilteredSortedParts() {
    let parts = ALL_PARTS.filter(function (p) { return activeCategories.indexOf(p.category) > -1; });

    if (searchTerm) {
        const term = searchTerm.toLowerCase();
        parts = parts.filter(function (p) {
            return (p.brand || '').toLowerCase().indexOf(term) > -1 ||
                   (p.modelName || '').toLowerCase().indexOf(term) > -1;
        });
    }

    if (currentSort === 'priceLow') {
        parts = parts.slice().sort(function (a, b) { return a.price - b.price; });
    } else if (currentSort === 'priceHigh') {
        parts = parts.slice().sort(function (a, b) { return b.price - a.price; });
    }

    return parts;
}

function renderTable() {
    const tbody = document.getElementById('partsTableBody');
    const parts = getFilteredSortedParts();

    if (parts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No matching parts found.</td></tr>';
        return;
    }

    tbody.innerHTML = parts.map(function (p) {
        const outOfStock = p.stocks <= 0;

        return '<tr class="' + (outOfStock ? 'out-of-stock' : '') + '">' +
            '<td>' + escapeHtml(p.category) + '</td>' +
            '<td>' + escapeHtml(p.brand) + '</td>' +
            '<td>' + escapeHtml(p.modelName) + '</td>' +
            '<td>' + (outOfStock ? 'Out of stock' : p.stocks) + '</td>' +
            '<td>' + formatPrice(p.price) + '</td>' +
            '<td style="white-space:nowrap">' +
            '<button type="button" class="btn btn-outline-secondary btn-sm" onclick="viewDetails(' + p.componentId + ', \'' + p.category + '\')">View</button>' +
            ' <a class="btn btn-primary btn-sm" href="/' + p.routePrefix + '/edit/' + p.componentId + '">Edit</a>' +
            ' <form action="/' + p.routePrefix + '/delete/' + p.componentId + '" method="post" style="display:inline;">' +
            '<input type="hidden" name="_method" value="delete"/>' +
            '<button type="submit" class="btn btn-danger btn-sm" onclick="return confirm(\'Are you sure?\')">Delete</button>' +
            '</form>' +
            '</td>' +
            '</tr>';
    }).join('');
}

function findPart(componentId, category) {
    return ALL_PARTS.find(function (p) { return p.componentId === componentId && p.category === category; });
}

function viewDetails(componentId, category) {
    const part = findPart(componentId, category);
    if (!part) return;

    document.getElementById('viewDetailsModalTitle').textContent = part.brand + ' ' + part.modelName;
    document.getElementById('viewDetailsPrice').textContent = formatPrice(part.price);

    const img = document.getElementById('viewDetailsImg');
    if (part.imageFileName) {
        img.src = '/images/' + part.imageFileName;
        img.style.display = '';
    } else {
        img.removeAttribute('src');
        img.style.display = 'none';
    }

    const fields = part.fields || {};
    const rows = Object.keys(fields).map(function (key) {
        return '<tr><th class="text-muted" style="width:45%">' + escapeHtml(key) + '</th><td>' + escapeHtml(fields[key]) + '</td></tr>';
    }).join('');

    document.querySelector('#viewDetailsTable tbody').innerHTML = rows +
        '<tr><th class="text-muted">Stocks</th><td>' + part.stocks + '</td></tr>';

    bootstrap.Modal.getOrCreateInstance(document.getElementById('viewDetailsModal')).show();
}

document.addEventListener('DOMContentLoaded', function () {
    renderCategoryChecklist();
    renderTable();

    document.getElementById('brandSearch').addEventListener('input', function () {
        searchTerm = this.value;
        renderTable();
    });

    document.getElementById('applyFilterBtn').addEventListener('click', function () {
        const checkedCategory = document.querySelector('.category-radio:checked');
        if (!checkedCategory || checkedCategory.value === '__ALL__') {
            activeCategories = ALL_CATEGORIES.slice();
        } else {
            activeCategories = [checkedCategory.value];
        }
        renderTable();
        bootstrap.Dropdown.getOrCreateInstance(document.getElementById('filterBtn')).hide();
    });

    document.querySelectorAll('input[name="sortOption"]').forEach(function (radio) {
        radio.addEventListener('change', function () {
            currentSort = this.value;
            renderTable();
            bootstrap.Dropdown.getOrCreateInstance(document.getElementById('sortBtn')).hide();
        });
    });
});
</script>
</body>
</html>
