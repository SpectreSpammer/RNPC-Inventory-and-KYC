<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>

<script th:inline="javascript">
/*<![CDATA[*/
const ALL_PARTS = /*[[${parts}]]*/ [];
const ALL_CATEGORIES = (/*[[${categories}]]*/ []).slice().sort();
/*]]>*/

let activeCategories = ALL_CATEGORIES.slice();
let activeAttributeValue = null;
let currentSort = 'relevance';
let searchTerm = '';

// The one attribute filtered on per category, matching the /build picker's per-category filters.
// Keyed by the display names PartsController sends as each part's "category" (e.g. "CPU Cooler",
// not the raw "COOLER" code /build uses internally) since that's what p.category holds here.
const CATEGORY_FIELD_MAP = {
    CPU: 'Brand',
    GPU: 'Brand',
    Motherboard: 'Socket',
    RAM: 'Type',
    Storage: 'Category',
    PSU: 'Wattage',
    Case: 'Tower Class',
    'CPU Cooler': 'Socket Support'
};

// Storage's raw Category values ("NVMe SSD", "SATA SSD", "HDD 7200 RPM", ...) collapse down
// to the three groupings requested for the filter: SSD, HDD, NVMe.
function storageCategoryLabel(raw) {
    if (!raw) return raw;
    if (raw.indexOf('NVMe') > -1) return 'NVMe';
    if (raw.indexOf('HDD') > -1) return 'HDD';
    return 'SSD';
}

// Case's raw Tower Class values ("Mid Tower", "Mid Tower (compact)", "Full Tower",
// "Super / Full Tower") collapse down to: Mid, Mid(Compact), Full, Super Full.
function caseTowerClassLabel(raw) {
    if (!raw) return raw;
    if (raw.indexOf('Super') > -1) return 'Super Full';
    if (raw.toLowerCase().indexOf('compact') > -1) return 'Mid(Compact)';
    if (raw.indexOf('Mid') > -1) return 'Mid';
    if (raw.indexOf('Full') > -1) return 'Full';
    return raw;
}

const CANONICAL_SOCKETS = ['AM4', 'AM5', 'LGA1200', 'LGA1700', 'LGA1851'];

// Cooler Socket Support is a compound string like "LGA1700/1200, AM5/AM4" or
// "LGA1851/1700/1200, AM5/AM4" meaning that one cooler supports several sockets.
// Each comma-separated group shares one letter prefix (LGA/AM) that carries over to
// the bare numbers after each "/" (so "LGA1700/1200" means LGA1700 AND LGA1200).
// Returns which of the canonical sockets that string covers.
function coolerSupportedSockets(raw) {
    if (!raw) return [];
    const supported = new Set();

    raw.split(',').forEach(function (group) {
        let prefix = '';
        group.trim().split('/').forEach(function (token) {
            token = token.trim();
            const letterMatch = token.match(/^([A-Za-z]+)/);
            if (letterMatch) {
                prefix = letterMatch[1];
                supported.add(token);
            } else if (prefix) {
                supported.add(prefix + token);
            }
        });
    });

    return CANONICAL_SOCKETS.filter(function (socket) { return supported.has(socket); });
}

// Most categories filter on a single value per part; Cooler can match several sockets
// at once, so this always returns an array (single-value categories return a 1-item array).
function getAttributeValues(part, category) {
    if (category === 'CPU Cooler') {
        return coolerSupportedSockets((part.fields || {})['Socket Support']);
    }
    const fieldKey = CATEGORY_FIELD_MAP[category];
    if (!fieldKey) return [];
    const raw = (part.fields || {})[fieldKey];
    if (raw === undefined || raw === null || raw === '') return [];
    if (category === 'Storage') return [storageCategoryLabel(raw)];
    if (category === 'Case') return [caseTowerClassLabel(raw)];
    return [raw];
}

// Values present in the catalog but deliberately left out of the filter's option list.
const ATTRIBUTE_VALUE_EXCLUSIONS = {
    GPU: ['Intel']
};

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
}

function formatPrice(value) {
    return 'Php ' + Number(value).toFixed(2);
}

// Each component is its own accordion section; picking a value inside one implicitly
// means "show only this component, filtered to this value" (there's no separate
// category picker anymore). Only one section can be the active filter at a time.
const FILTER_SECTIONS = ['CPU', 'CPU Cooler', 'Case', 'GPU', 'Motherboard', 'PSU', 'RAM', 'Storage'];

function sectionId(category) {
    return category.replace(/[^A-Za-z0-9]/g, '');
}

function renderAllFilterSections() {
    FILTER_SECTIONS.forEach(renderFilterSection);
}

function renderFilterSection(category) {
    const id = sectionId(category);
    const container = document.getElementById('filterOptions_' + id);
    if (!container) return;

    const radioName = 'filterRadio_' + id;
    const isActiveSection = activeCategories.length === 1 && activeCategories[0] === category;

    const excluded = ATTRIBUTE_VALUE_EXCLUSIONS[category] || [];
    const partsInCategory = ALL_PARTS.filter(function (p) { return p.category === category; });
    const values = Array.from(new Set(
        partsInCategory.reduce(function (acc, p) { return acc.concat(getAttributeValues(p, category)); }, [])
    ))
        .filter(function (val) { return excluded.indexOf(val) === -1; })
        .sort(category === 'PSU' ? function (a, b) { return Number(a) - Number(b); } : undefined);

    const selectedValue = isActiveSection ? activeAttributeValue : undefined;

    container.innerHTML = '<div class="form-check">' +
        '<input class="form-check-input filter-option-radio" type="radio" name="' + radioName + '" data-category="' + escapeHtml(category) + '" value="__ALL__" id="' + radioName + '_all" ' + (isActiveSection && selectedValue === null ? 'checked' : '') + '>' +
        '<label class="form-check-label" for="' + radioName + '_all">All</label>' +
        '</div>' +
        values.map(function (val, i) {
            const checked = isActiveSection && selectedValue === val ? 'checked' : '';
            const displayLabel = category === 'PSU' ? val + 'W' : val;
            const optId = radioName + '_' + i;
            return '<div class="form-check">' +
                '<input class="form-check-input filter-option-radio" type="radio" name="' + radioName + '" data-category="' + escapeHtml(category) + '" value="' + escapeHtml(val) + '" id="' + optId + '" ' + checked + '>' +
                '<label class="form-check-label" for="' + optId + '">' + escapeHtml(displayLabel) + '</label>' +
                '</div>';
        }).join('');

    updateSectionBadge(category);
}

function updateSectionBadge(category) {
    const id = sectionId(category);
    const badge = document.getElementById('filterBadge_' + id);
    if (!badge) return;

    const isActiveSection = activeCategories.length === 1 && activeCategories[0] === category;
    if (isActiveSection) {
        badge.textContent = '1';
        badge.style.display = '';
    } else {
        badge.style.display = 'none';
    }
}

// Selecting a radio in one component's section clears any selection in the others,
// since only one component can be the active filter at a time.
function selectFilterOption(category, value) {
    activeCategories = [category];
    activeAttributeValue = (value === '__ALL__') ? null : value;
    renderAllFilterSections();
}

function getFilteredSortedParts() {
    let parts = ALL_PARTS.filter(function (p) { return activeCategories.indexOf(p.category) > -1; });

    if (activeAttributeValue !== null && activeCategories.length === 1) {
        const category = activeCategories[0];
        parts = parts.filter(function (p) { return getAttributeValues(p, category).indexOf(activeAttributeValue) > -1; });
    }

    if (searchTerm) {
        const term = searchTerm.toLowerCase();
        parts = parts.filter(function (p) {
            return (p.brand || '').toLowerCase().indexOf(term) > -1 ||
                   (p.modelName || '').toLowerCase().indexOf(term) > -1;
        });
    }

    if (currentSort === 'priceLow') {
        parts = parts.slice().sort(function (a, b) { return a.price - b.price; });
    } else if (currentSort === 'priceHigh') {
        parts = parts.slice().sort(function (a, b) { return b.price - a.price; });
    }

    return parts;
}

const SOCKET_OR_TYPE_FIELD = {
    CPU: 'Socket',
    Motherboard: 'Socket',
    'CPU Cooler': 'Socket Support',
    RAM: 'Type',
    Case: 'Tower Class',
    GPU: 'Memory Type',
    PSU: 'Modularity',
    Storage: 'Form Factor'
};

function socketOrType(part) {
    const fieldKey = SOCKET_OR_TYPE_FIELD[part.category];
    if (!fieldKey) return '';
    return (part.fields || {})[fieldKey] || '';
}

function renderTable() {
    const tbody = document.getElementById('partsTableBody');
    const parts = getFilteredSortedParts();

    if (parts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No matching parts found.</td></tr>';
        return;
    }

    tbody.innerHTML = parts.map(function (p) {
        const outOfStock = p.stocks <= 0;

        return '<tr class="' + (outOfStock ? 'out-of-stock' : '') + '">' +
            '<td>' + escapeHtml(p.category) + '</td>' +
            '<td>' + escapeHtml(p.brand) + '</td>' +
            '<td>' + escapeHtml(p.modelName) + '</td>' +
            '<td>' + escapeHtml(socketOrType(p)) + '</td>' +
            '<td>' + (outOfStock ? 'Out of stock' : p.stocks) + '</td>' +
            '<td>' + formatPrice(p.price) + '</td>' +
            '<td style="white-space:nowrap">' +
            '<button type="button" class="btn btn-outline-secondary btn-sm" onclick="viewDetails(' + p.componentId + ', \'' + p.category + '\')">View</button>' +
            ' <a class="btn btn-primary btn-sm" href="/' + p.routePrefix + '/edit/' + p.componentId + '">Edit</a>' +
            ' <form action="/' + p.routePrefix + '/delete/' + p.componentId + '" method="post" style="display:inline;">' +
            '<input type="hidden" name="_method" value="delete"/>' +
            '<button type="submit" class="btn btn-danger btn-sm" onclick="return confirm(\'Are you sure?\')">Delete</button>' +
            '</form>' +
            '</td>' +
            '</tr>';
    }).join('');
}

function findPart(componentId, category) {
    return ALL_PARTS.find(function (p) { return p.componentId === componentId && p.category === category; });
}

function viewDetails(componentId, category) {
    const part = findPart(componentId, category);
    if (!part) return;

    document.getElementById('viewDetailsModalTitle').textContent = part.brand + ' ' + part.modelName;
    document.getElementById('viewDetailsPrice').textContent = formatPrice(part.price);

    const img = document.getElementById('viewDetailsImg');
    if (part.imageFileName) {
        img.src = '/images/' + part.imageFileName;
        img.style.display = '';
    } else {
        img.removeAttribute('src');
        img.style.display = 'none';
    }

    const fields = part.fields || {};
    const rows = Object.keys(fields).map(function (key) {
        return '<tr><th class="text-muted" style="width:45%">' + escapeHtml(key) + '</th><td>' + escapeHtml(fields[key]) + '</td></tr>';
    }).join('');

    document.querySelector('#viewDetailsTable tbody').innerHTML = rows +
        '<tr><th class="text-muted">Stocks</th><td>' + part.stocks + '</td></tr>';

    bootstrap.Modal.getOrCreateInstance(document.getElementById('viewDetailsModal')).show();
}

document.addEventListener('DOMContentLoaded', function () {
    // Lets Cancel/Save on a category's create-edit form send the admin back to that same
    // filtered view instead of the unfiltered list (which visually looks like it "jumped to
    // CPU" since CPU sorts first alphabetically).
    const requestedCategory = new URLSearchParams(window.location.search).get('category');
    if (requestedCategory && ALL_CATEGORIES.indexOf(requestedCategory) > -1) {
        activeCategories = [requestedCategory];
        activeAttributeValue = null;
    }

    renderAllFilterSections();
    renderTable();

    document.getElementById('brandSearch').addEventListener('input', function () {
        searchTerm = this.value;
        renderTable();
    });

    document.getElementById('partsFilterAccordion').addEventListener('change', function (e) {
        if (!e.target.classList.contains('filter-option-radio')) return;
        selectFilterOption(e.target.getAttribute('data-category'), e.target.value);
    });

    document.getElementById('applyFilterBtn').addEventListener('click', function () {
        renderTable();
        bootstrap.Dropdown.getOrCreateInstance(document.getElementById('filterBtn')).hide();
    });

    document.getElementById('resetFilterBtn').addEventListener('click', function () {
        activeCategories = ALL_CATEGORIES.slice();
        activeAttributeValue = null;

        renderAllFilterSections();
        renderTable();

        bootstrap.Dropdown.getOrCreateInstance(document.getElementById('filterBtn')).hide();
    });

    document.querySelectorAll('input[name="sortOption"]').forEach(function (radio) {
        radio.addEventListener('change', function () {
            currentSort = this.value;
            renderTable();
            bootstrap.Dropdown.getOrCreateInstance(document.getElementById('sortBtn')).hide();
        });
    });
});
</script>
</body>
</html>
