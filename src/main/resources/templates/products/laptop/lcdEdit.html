<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit LCD - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Type-based edit form - same shape as lcdCreate.html, differing only in the action,
  the _method=put field, the photo section and the save label.

  Reached from /laptop/edit/{id} when the part's stored partType is this type. PUT
  /laptop/update/{id} validates against the STORED type, so the type cannot change on edit.
  Remove photo keeps the X-Requested-With header and res.ok check
  (fragments/parts-form :: remove-photo-script), keyed by laptopPartId.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='laptop-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='LCD', title=${#strings.isEmpty(laptopPartsDto.partName) ? 'Edit LCD' : 'Edit ' + laptopPartsDto.partName}, subtitle='Changes apply to the laptop parts list as soon as you save.', backUrl=@{/laptop})}"></div>

            <form th:action="@{/laptop/update/{id}(id=${laptopPartId})}" th:object="${laptopPartsDto}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="_method" value="put"/>
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>Part details</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">Select brand</option>
                                    <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="partName">Part name</label>
                                <input type="text" th:field="*{partName}" id="partName" placeholder="e.g. Inspiron 15 3000 LCD"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('partName')}" th:errors="*{partName}"></span>
                            </div>
                            <div class="pf-field pf-full">
                                <label for="compatibleModels">Compatible models</label>
                                <input type="text" th:field="*{compatibleModels}" id="compatibleModels" placeholder="e.g. Inspiron 15 3511, 3520"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('compatibleModels')}" th:errors="*{compatibleModels}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="partNumber">Part number <span class="pf-optional">(optional)</span></label>
                                <input type="text" th:field="*{partNumber}" id="partNumber" placeholder="e.g. 0M5RH2"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('partNumber')}" th:errors="*{partNumber}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="partCondition">Condition</label>
                                <select th:field="*{partCondition}" id="partCondition">
                                    <option value="">Select condition</option>
                                    <option th:each="c : ${conditionOptions}" th:value="${c.name()}" th:text="${c.label}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('partCondition')}" th:errors="*{partCondition}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="warrantyDays">Warranty days <span class="pf-optional">(optional)</span></label>
                                <input type="number" th:field="*{warrantyDays}" id="warrantyDays" min="0" placeholder="e.g. 30"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('warrantyDays')}" th:errors="*{warrantyDays}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>LCD specs</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="lcdSizeInches">Size</label>
                                <select th:field="*{lcdSizeInches}" id="lcdSizeInches">
                                    <option value="">Select size</option>
                                    <option value="11.6">11.6 in</option>
                                    <option value="12.5">12.5 in</option>
                                    <option value="13.3">13.3 in</option>
                                    <option value="14.0">14.0 in</option>
                                    <option value="15.6">15.6 in</option>
                                    <option value="16.0">16.0 in</option>
                                    <option value="17.3">17.3 in</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdSizeInches')}" th:errors="*{lcdSizeInches}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="lcdResolution">Resolution</label>
                                <select th:field="*{lcdResolution}" id="lcdResolution">
                                    <option value="">Select resolution</option>
                                    <option value="HD 1366x768">HD 1366x768</option>
                                    <option value="HD+ 1600x900">HD+ 1600x900</option>
                                    <option value="FHD 1920x1080">FHD 1920x1080</option>
                                    <option value="QHD 2560x1440">QHD 2560x1440</option>
                                    <option value="UHD 3840x2160">UHD 3840x2160</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdResolution')}" th:errors="*{lcdResolution}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="lcdPanelType">Panel type</label>
                                <select th:field="*{lcdPanelType}" id="lcdPanelType">
                                    <option value="">Select panel type</option>
                                    <option value="TN">TN</option>
                                    <option value="IPS">IPS</option>
                                    <option value="VA">VA</option>
                                    <option value="OLED">OLED</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdPanelType')}" th:errors="*{lcdPanelType}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="lcdConnector">Connector</label>
                                <select th:field="*{lcdConnector}" id="lcdConnector">
                                    <option value="">Select connector</option>
                                    <option value="30-pin eDP">30-pin eDP</option>
                                    <option value="40-pin eDP">40-pin eDP</option>
                                    <option value="40-pin LVDS">40-pin LVDS</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdConnector')}" th:errors="*{lcdConnector}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="lcdRefreshRateHz">Refresh rate <span class="pf-optional">(optional)</span></label>
                                <select th:field="*{lcdRefreshRateHz}" id="lcdRefreshRateHz">
                                    <option value="">Not specified</option>
                                    <option value="60">60 Hz</option>
                                    <option value="90">90 Hz</option>
                                    <option value="120">120 Hz</option>
                                    <option value="144">144 Hz</option>
                                    <option value="165">165 Hz</option>
                                    <option value="240">240 Hz</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdRefreshRateHz')}" th:errors="*{lcdRefreshRateHz}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="lcdSurface">Surface <span class="pf-optional">(optional)</span></label>
                                <select th:field="*{lcdSurface}" id="lcdSurface">
                                    <option value="">Not specified</option>
                                    <option value="Matte">Matte</option>
                                    <option value="Glossy">Glossy</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdSurface')}" th:errors="*{lcdSurface}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="lcdMounting">Mounting <span class="pf-optional">(optional)</span></label>
                                <select th:field="*{lcdMounting}" id="lcdMounting">
                                    <option value="">Not specified</option>
                                    <option value="With brackets">With brackets</option>
                                    <option value="Without brackets">Without brackets</option>
                                    <option value="Slim">Slim</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdMounting')}" th:errors="*{lcdMounting}"></span>
                            </div>
                            <div class="pf-field">
                                <span class="pf-label">Touch</span>
                                <label class="pf-check"><input type="checkbox" th:field="*{lcdTouch}"/>Touchscreen panel</label>
                                <span class="pf-error" th:if="${#fields.hasErrors('lcdTouch')}" th:errors="*{lcdTouch}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks" min="0" placeholder="Enter stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" placeholder="Enter price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Notes <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-grid">
                            <div class="pf-field pf-full">
                                <label for="description">Notes</label>
                                <textarea th:field="*{description}" id="description" rows="3" placeholder="Anything else worth knowing: markings, defects, where it came from"></textarea>
                                <span class="pf-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong th:text="${currentImage} ? 'Replace the current photo' : 'Choose a photo for this part'"></strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                        <th:block th:if="${currentImage}">
                            <div th:replace="~{fragments/parts-form :: current-photo(currentImage=${currentImage}, removeUrl=@{/laptop/removePhoto/{id}(id=${laptopPartId})})}"></div>
                        </th:block>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/laptop}, saveLabel='Save changes')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<script th:replace="~{fragments/parts-form :: remove-photo-script}"></script>
</body>
</html>
