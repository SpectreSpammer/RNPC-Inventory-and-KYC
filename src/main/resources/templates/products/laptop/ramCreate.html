<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add RAM - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Type-based create form for RAM parts (laptop redesign batch 4),
  following the CPU pair on fragments/parts-form.html and parts-form.css.

  Posts to /laptop/ram/create. The part type comes from that path, never from a form
  field - there is deliberately no partType input. The controller validates
  Default + this type's PartType.Groups group through a SmartValidator; each type group
  extends Typed, which makes Condition required on every form.

  Brand and Condition options come from the controller (brandOptions, conditionOptions);
  the spec selects are hard-coded and mirror the @Pattern allow-lists on LaptopPartsDto.
  "Notes" binds to description - the same column (LaptopParts.notes).
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='laptop-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='RAM', title='Add RAM', subtitle='Fields marked optional can be filled in later.', backUrl=@{/laptop})}"></div>

            <form action="#" th:action="@{/laptop/ram/create}" th:object="${laptopPartsDto}" method="post" enctype="multipart/form-data">
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>Part details</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">Select brand</option>
                                    <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="partName">Part name</label>
                                <input type="text" th:field="*{partName}" id="partName" placeholder="e.g. Samsung 8GB DDR4 3200 SODIMM"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('partName')}" th:errors="*{partName}"></span>
                            </div>
                            <div class="pf-field pf-full">
                                <label for="compatibleModels">Compatible models <span class="pf-optional">(optional)</span></label>
                                <input type="text" th:field="*{compatibleModels}" id="compatibleModels" placeholder="e.g. Inspiron 15 3511, 3520"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('compatibleModels')}" th:errors="*{compatibleModels}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="partNumber">Part number <span class="pf-optional">(optional)</span></label>
                                <input type="text" th:field="*{partNumber}" id="partNumber" placeholder="e.g. 0M5RH2"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('partNumber')}" th:errors="*{partNumber}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="partCondition">Condition</label>
                                <select th:field="*{partCondition}" id="partCondition">
                                    <option value="">Select condition</option>
                                    <option th:each="c : ${conditionOptions}" th:value="${c.name()}" th:text="${c.label}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('partCondition')}" th:errors="*{partCondition}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="warrantyDays">Warranty days <span class="pf-optional">(optional)</span></label>
                                <input type="number" th:field="*{warrantyDays}" id="warrantyDays" min="0" placeholder="e.g. 30"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('warrantyDays')}" th:errors="*{warrantyDays}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>RAM specs</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="ramType">Type</label>
                                <select th:field="*{ramType}" id="ramType">
                                    <option value="">Select type</option>
                                    <option value="DDR3L">DDR3L</option>
                                    <option value="DDR4">DDR4</option>
                                    <option value="DDR5">DDR5</option>
                                    <option value="LPDDR4X">LPDDR4X</option>
                                    <option value="LPDDR5">LPDDR5</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('ramType')}" th:errors="*{ramType}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="ramCapacityGb">Capacity</label>
                                <select th:field="*{ramCapacityGb}" id="ramCapacityGb">
                                    <option value="">Select capacity</option>
                                    <option value="4">4 GB</option>
                                    <option value="8">8 GB</option>
                                    <option value="16">16 GB</option>
                                    <option value="32">32 GB</option>
                                    <option value="64">64 GB</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('ramCapacityGb')}" th:errors="*{ramCapacityGb}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="ramSpeedMts">Speed <span class="pf-optional">(optional)</span></label>
                                <select th:field="*{ramSpeedMts}" id="ramSpeedMts">
                                    <option value="">Not specified</option>
                                    <option value="1600">1600 MT/s</option>
                                    <option value="2400">2400 MT/s</option>
                                    <option value="2666">2666 MT/s</option>
                                    <option value="3200">3200 MT/s</option>
                                    <option value="4800">4800 MT/s</option>
                                    <option value="5600">5600 MT/s</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('ramSpeedMts')}" th:errors="*{ramSpeedMts}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks" min="0" placeholder="Enter stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" placeholder="Enter price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Notes <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-grid">
                            <div class="pf-field pf-full">
                                <label for="description">Notes</label>
                                <textarea th:field="*{description}" id="description" rows="3" placeholder="Anything else worth knowing: markings, defects, where it came from"></textarea>
                                <span class="pf-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong>Choose a photo for this part</strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/laptop}, saveLabel='Save part')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
</body>
</html>
