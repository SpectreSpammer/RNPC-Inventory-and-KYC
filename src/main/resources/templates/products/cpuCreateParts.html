<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add CPU - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Reference create form for the parts conversion - the other seven categories copy this shape.
  VISUAL CONVERSION ONLY: the entity, DTO, controller, URLs, field names, validation and dropdowns
  are untouched. Every field the old Bootstrap form had is still here, with the same th:field, and
  both selects are still populated from the same brandOptions / socketOptions the controller
  supplies from getDistinctBrands() / getDistinctSockets(). The mockup (gpt/admin/Add CPU@1x.png)
  shows fewer fields than the real form; the real fields win.

  Shared chrome comes from fragments/parts-form.html. The field markup stays here, explicit, with
  its own th:field - see that file's header for why.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='pc-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='CPU', title='Add CPU', subtitle='Fields marked optional can be filled in later.', backUrl=@{/computer(category='CPU')})}"></div>

            <form action="#" th:action="@{/cpu/create}" th:object="${cpuPartsDto}" method="post" enctype="multipart/form-data">
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>CPU details</h2>
                        <div class="pf-grid">

                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">-- Select Brand --</option>
                                    <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="modelName">Model</label>
                                <input type="text" th:field="*{modelName}" id="modelName" placeholder="e.g. Ryzen 5 9600X"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="socket">Socket</label>
                                <select th:field="*{socket}" id="socket">
                                    <option value="">-- Select Socket --</option>
                                    <option th:each="opt : ${socketOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('socket')}" th:errors="*{socket}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="generation">Generation</label>
                                <input type="text" th:field="*{generation}" id="generation" placeholder="e.g. Ryzen 9000 (Granite Ridge)"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('generation')}" th:errors="*{generation}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="cores">Cores</label>
                                <input type="number" th:field="*{cores}" id="cores"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('cores')}" th:errors="*{cores}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="thread">Thread</label>
                                <input type="number" th:field="*{thread}" id="thread"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('thread')}" th:errors="*{thread}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="baseClockGhz">Base Clock(Ghz)</label>
                                <input type="number" step="0.1" th:field="*{baseClockGhz}" id="baseClockGhz"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('baseClockGhz')}" th:errors="*{baseClockGhz}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="boostClockGhz">Boost Clock(Ghz)</label>
                                <input type="number" step="0.1" th:field="*{boostClockGhz}" id="boostClockGhz"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('boostClockGhz')}" th:errors="*{boostClockGhz}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="integratedGraphics">Integrated Graphics</label>
                                <input type="text" th:field="*{integratedGraphics}" id="integratedGraphics" placeholder="e.g. None, Radeon Graphics"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('integratedGraphics')}" th:errors="*{integratedGraphics}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="memorySupport">Memory Support</label>
                                <input type="text" th:field="*{memorySupport}" id="memorySupport" placeholder="e.g. DDR5-5600"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('memorySupport')}" th:errors="*{memorySupport}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="launchYear">Launch Year</label>
                                <input type="number" th:field="*{launchYear}" id="launchYear"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('launchYear')}" th:errors="*{launchYear}"></span>
                            </div>

                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks" placeholder="Enter stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" placeholder="Enter price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-hint">Shown to customers at checkout.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong>Choose a photo for this part</strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/computer(category='CPU')}, saveLabel='Save part')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
</body>
</html>
