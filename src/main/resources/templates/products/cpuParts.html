<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">CPU Parts</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>
    <div class="row mb-3">
        <div class="col-md-3 mb-3">
            <a class="btn btn-primary w-50" href="/cpu/create">Add CPU</a>
        </div>
        <div class="col-md-9">
            <div class="input-group rounded">
                <input type="search" class="form-control rounded" id="brandSearch" placeholder="Search by brand or model" aria-label="Search" aria-describedby="search-addon" />
                <span class="input-group-text border-0" id="search-addon">
                <i class="fas fa-search"></i>
            </span>
            </div>
        </div>
    </div>

    <table class="table" id="partsTable">
        <thead>
        <tr>
            <th>Brand</th>
            <th>Generation</th>
            <th>Model</th>
            <th>Socket</th>
            <th>Cores</th>
            <th>Thread</th>
            <th>Base Clock(Ghz)</th>
            <th>Boost Clock(Ghz)</th>
            <th>Integrated Graphics</th>
            <th>Memory Support</th>
            <th>Launch Year</th>
            <th>Stocks</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="part : ${parts}">
            <td th:text="${part.brand}"></td>
            <td th:text="${part.generation}"></td>
            <td th:text="${part.modelName}"></td>
            <td th:text="${part.socket}"></td>
            <td th:text="${part.cores}"></td>
            <td th:text="${part.thread}"></td>
            <td th:text="${part.baseClockGhz}"></td>
            <td th:text="${part.boostClockGhz}"></td>
            <td th:text="${part.integratedGraphics}"></td>
            <td th:text="${part.memorySupport}"></td>
            <td th:text="${part.launchYear}"></td>
            <td th:text="${part.stocks}"></td>
            <td>Php <span th:text="${part.price}"></span></td>
            <td style="white-space:nowrap">
                <a class="btn btn-primary btn-sm"
                   th:href="@{/cpu/edit/{id} (id=${part.cpuId})}">Edit
                </a>
                <form th:action="@{/cpu/delete/{id}(id=${part.cpuId})}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const brandSearch = document.getElementById('brandSearch');
        const table = document.getElementById('partsTable');
        const rows = table.getElementsByTagName('tr');

        brandSearch.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            for (let i = 1; i < rows.length; i++) {
                const rowText = rows[i].textContent || rows[i].innerText;
                rows[i].style.display = rowText.toLowerCase().indexOf(filter) > -1 ? '' : 'none';
            }
        });
    });
</script>
</body>
</html>
