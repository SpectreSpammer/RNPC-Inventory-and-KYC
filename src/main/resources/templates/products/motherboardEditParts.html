<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit Motherboard - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page">

<!--
  Edit form for Motherboard - same shape as its create page, differing only in the action, the
  _method=put field, the photo section and the save label. VISUAL CONVERSION ONLY; the
  removePhoto behaviour is exactly as before, X-Requested-With header and res.ok check
  included (see fragments/parts-form :: remove-photo-script). This page previously had no
  shell at all - no sidebar, no topbar, just a centered Bootstrap form.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='pc-parts', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='MB', title=${#strings.isEmpty(motherboardPartsDto.modelName) ? 'Edit Motherboard' : 'Edit ' + motherboardPartsDto.modelName}, subtitle='Changes apply to the parts list and PC builder as soon as you save.', backUrl=@{/computer(category='Motherboard')})}"></div>

            <form th:action="@{/motherboard/update/{id}(id=${partId})}" th:object="${motherboardPartsDto}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="_method" value="put"/>
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>Motherboard details</h2>
                        <div class="pf-grid">

                            <div class="pf-field">
                                <label for="brand">Brand</label>
                                <select th:field="*{brand}" id="brand">
                                    <option value="">-- Select Brand --</option>
                                    <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="modelName">Model</label>
                                <input type="text" th:field="*{modelName}" id="modelName"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="chipset">Chipset</label>
                                <input type="text" th:field="*{chipset}" id="chipset"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('chipset')}" th:errors="*{chipset}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="socket">Socket</label>
                                <select th:field="*{socket}" id="socket">
                                    <option value="">-- Select Socket --</option>
                                    <option th:each="opt : ${socketOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('socket')}" th:errors="*{socket}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="cpuPlatform">CPU Platform</label>
                                <input type="text" th:field="*{cpuPlatform}" id="cpuPlatform"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('cpuPlatform')}" th:errors="*{cpuPlatform}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="formFactor">Form Factor</label>
                                <select th:field="*{formFactor}" id="formFactor">
                                    <option value="">-- Select Form Factor --</option>
                                    <option th:each="opt : ${formFactorOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('formFactor')}" th:errors="*{formFactor}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="memoryType">Memory Type</label>
                                <select th:field="*{memoryType}" id="memoryType">
                                    <option value="">-- Select Memory Type --</option>
                                    <option th:each="opt : ${memoryTypeOptions}" th:value="${opt}" th:text="${opt}"></option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('memoryType')}" th:errors="*{memoryType}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="ramSlots">RAM Slots</label>
                                <input type="number" th:field="*{ramSlots}" id="ramSlots"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('ramSlots')}" th:errors="*{ramSlots}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="maxRam">Max Ram</label>
                                <input type="text" th:field="*{maxRam}" id="maxRam"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('maxRam')}" th:errors="*{maxRam}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="m2Slots">M.2 Slots</label>
                                <input type="number" th:field="*{m2Slots}" id="m2Slots"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('m2Slots')}" th:errors="*{m2Slots}"></span>
                            </div>

                            <div class="pf-field">
                                <label for="pcieVersion">PCIe Version</label>
                                <input type="text" th:field="*{pcieVersion}" id="pcieVersion"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('pcieVersion')}" th:errors="*{pcieVersion}"></span>
                            </div>

                            <div class="pf-field pf-full">
                                <label for="notableFeatures">Notable Features</label>
                                <textarea th:field="*{notableFeatures}" id="notableFeatures" rows="3"></textarea>
                                <span class="pf-error" th:if="${#fields.hasErrors('notableFeatures')}" th:errors="*{notableFeatures}"></span>
                            </div>

                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Stock and price</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="stocks">Stocks</label>
                                <input type="number" th:field="*{stocks}" id="stocks"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="price">Price</label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{price}" id="price" step="0.01" min="0"/>
                                </div>
                                <span class="pf-hint">Shown to customers at checkout.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong th:text="${currentImage} ? 'Replace the current photo' : 'Choose a photo for this part'"></strong>
                                <input type="file" th:field="*{imageFile}" id="imageFile"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                        <th:block th:if="${currentImage}">
                            <div th:replace="~{fragments/parts-form :: current-photo(currentImage=${currentImage}, removeUrl=@{/motherboard/removePhoto/{id}(id=${partId})})}"></div>
                        </th:block>
                    </section>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/computer(category='Motherboard')}, saveLabel='Save changes')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<script th:replace="~{fragments/parts-form :: remove-photo-script}"></script>
</body>
</html>
