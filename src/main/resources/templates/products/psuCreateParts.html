<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Add PSU</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>
    <form action="#" th:action="@{/psu/create}" th:object="${psuPartsDto}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <select th:field="*{brand}" class="form-select" id="brand">
                <option value="">-- Select Brand --</option>
                <option th:each="opt : ${brandOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
        </div>

        <div class="mb-3">
            <label for="modelName" class="form-label">Model</label>
            <input type="text" th:field="*{modelName}" class="form-control" id="modelName" placeholder="e.g. RM850x">
            <div class="text-danger" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
        </div>

        <div class="mb-3">
            <label for="wattageW" class="form-label">Wattage</label>
            <input type="number" th:field="*{wattageW}" class="form-control" id="wattageW">
            <div class="text-danger" th:if="${#fields.hasErrors('wattageW')}" th:errors="*{wattageW}"></div>
        </div>

        <div class="mb-3">
            <label for="plusRating" class="form-label">80 PLUS Rating</label>
            <select th:field="*{plusRating}" class="form-select" id="plusRating">
                <option value="">-- Select Rating --</option>
                <option th:each="opt : ${plusRatingOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('plusRating')}" th:errors="*{plusRating}"></div>
        </div>

        <div class="mb-3">
            <label for="modularity" class="form-label">Modularity</label>
            <select th:field="*{modularity}" class="form-select" id="modularity">
                <option value="">-- Select Modularity --</option>
                <option th:each="opt : ${modularityOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('modularity')}" th:errors="*{modularity}"></div>
        </div>

        <div class="mb-3">
            <label for="formFactor" class="form-label">Form Factor</label>
            <select th:field="*{formFactor}" class="form-select" id="formFactor">
                <option value="">-- Select Form Factor --</option>
                <option th:each="opt : ${formFactorOptions}" th:value="${opt}" th:text="${opt}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('formFactor')}" th:errors="*{formFactor}"></div>
        </div>

        <div class="mb-3">
            <label for="warrantyYears" class="form-label">Warranty</label>
            <input type="number" th:field="*{warrantyYears}" class="form-control" id="warrantyYears" placeholder="Years">
            <div class="text-danger" th:if="${#fields.hasErrors('warrantyYears')}" th:errors="*{warrantyYears}"></div>
        </div>

        <div class="mb-3">
            <label for="notes" class="form-label">Notes</label>
            <textarea th:field="*{notes}" class="form-control" id="notes" rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
        </div>

        <div class="mb-3">
            <label for="stocks" class="form-label">Stocks</label>
            <input type="number" th:field="*{stocks}" class="form-control" id="stocks" placeholder="Enter stocks">
            <div class="text-danger" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <div class="input-group">
                <span class="input-group-text">Php</span>
                <input type="number" th:field="*{price}" class="form-control" id="price" placeholder="Enter price" step="0.01" min="0">
            </div>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Image <span class="text-muted">(optional)</span></label>
            <input type="file" th:field="*{imageFile}" class="form-control" id="imageFile">
            <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
        </div>

        <div class="row">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" th:href="@{/computer(category='PSU')}" role="button">Cancel</a>
            </div>
        </div>

    </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>
</body>
</html>
