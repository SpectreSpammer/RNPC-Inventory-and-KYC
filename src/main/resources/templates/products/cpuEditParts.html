<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
</head>
<body>
<div class="container">
    <a href="/">
        <h1 class="text-center my-4">Edit CPU</h1>
    </a>
    <form th:action="@{/cpu/update/{id}(id=${partId})}" th:object="${cpuPartsDto}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="_method" value="put"/>

        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <input type="text" th:field="*{brand}" class="form-control" id="brand">
            <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
        </div>

        <div class="mb-3">
            <label for="generation" class="form-label">Generation</label>
            <input type="text" th:field="*{generation}" class="form-control" id="generation">
            <div class="text-danger" th:if="${#fields.hasErrors('generation')}" th:errors="*{generation}"></div>
        </div>

        <div class="mb-3">
            <label for="modelName" class="form-label">Model</label>
            <input type="text" th:field="*{modelName}" class="form-control" id="modelName">
            <div class="text-danger" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
        </div>

        <div class="mb-3">
            <label for="socket" class="form-label">Socket</label>
            <input type="text" th:field="*{socket}" class="form-control" id="socket">
            <div class="text-danger" th:if="${#fields.hasErrors('socket')}" th:errors="*{socket}"></div>
        </div>

        <div class="mb-3">
            <label for="cores" class="form-label">Cores</label>
            <input type="number" th:field="*{cores}" class="form-control" id="cores">
            <div class="text-danger" th:if="${#fields.hasErrors('cores')}" th:errors="*{cores}"></div>
        </div>

        <div class="mb-3">
            <label for="thread" class="form-label">Thread</label>
            <input type="number" th:field="*{thread}" class="form-control" id="thread">
            <div class="text-danger" th:if="${#fields.hasErrors('thread')}" th:errors="*{thread}"></div>
        </div>

        <div class="mb-3">
            <label for="baseClockGhz" class="form-label">Base Clock(Ghz)</label>
            <input type="number" step="0.1" th:field="*{baseClockGhz}" class="form-control" id="baseClockGhz">
            <div class="text-danger" th:if="${#fields.hasErrors('baseClockGhz')}" th:errors="*{baseClockGhz}"></div>
        </div>

        <div class="mb-3">
            <label for="boostClockGhz" class="form-label">Boost Clock(Ghz)</label>
            <input type="number" step="0.1" th:field="*{boostClockGhz}" class="form-control" id="boostClockGhz">
            <div class="text-danger" th:if="${#fields.hasErrors('boostClockGhz')}" th:errors="*{boostClockGhz}"></div>
        </div>

        <div class="mb-3">
            <label for="integratedGraphics" class="form-label">Integrated Graphics</label>
            <input type="text" th:field="*{integratedGraphics}" class="form-control" id="integratedGraphics">
            <div class="text-danger" th:if="${#fields.hasErrors('integratedGraphics')}" th:errors="*{integratedGraphics}"></div>
        </div>

        <div class="mb-3">
            <label for="memorySupport" class="form-label">Memory Support</label>
            <input type="text" th:field="*{memorySupport}" class="form-control" id="memorySupport">
            <div class="text-danger" th:if="${#fields.hasErrors('memorySupport')}" th:errors="*{memorySupport}"></div>
        </div>

        <div class="mb-3">
            <label for="launchYear" class="form-label">Launch Year</label>
            <input type="number" th:field="*{launchYear}" class="form-control" id="launchYear">
            <div class="text-danger" th:if="${#fields.hasErrors('launchYear')}" th:errors="*{launchYear}"></div>
        </div>

        <div class="mb-3">
            <label for="stocks" class="form-label">Stocks</label>
            <input type="number" th:field="*{stocks}" class="form-control" id="stocks">
            <div class="text-danger" th:if="${#fields.hasErrors('stocks')}" th:errors="*{stocks}"></div>
        </div>

        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <div class="input-group">
                <span class="input-group-text">Php</span>
                <input type="number" th:field="*{price}" class="form-control" id="price" step="0.01" min="0">
            </div>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Image <span class="text-muted">(optional)</span></label>
            <input type="file" th:field="*{imageFile}" class="form-control" id="imageFile">
            <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
            <div th:if="${currentImage}" class="mt-2">
                <img th:src="@{/images/{imageFileName}(imageFileName=${currentImage})}"
                     class="img-fluid d-block mb-2" width="180px"/>
                <button type="button" class="btn btn-outline-danger btn-sm remove-photo-btn"
                        th:attr="data-remove-url=@{/cpu/removePhoto/{id}(id=${partId})}">
                    Remove Photo
                </button>
            </div>
        </div>

        <div class="row">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" href="/computer" role="button">Cancel</a>
            </div>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.remove-photo-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (!confirm('Remove the current photo?')) return;
                fetch(btn.dataset.removeUrl, { method: 'DELETE' })
                    .then(function() { window.location.reload(); });
            });
        });
    });
</script>
</body>
</html>
