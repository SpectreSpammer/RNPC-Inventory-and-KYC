<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .calendar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .calendar-toolbar h2 {
            margin: 0;
            font-size: 1.4em;
            font-weight: 600;
            color: #1b211f;
        }
        .calendar-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .calendar-legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 0.85em;
            color: #69756f;
        }
        .calendar-legend .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid #e3dfd5;
            border-left: 1px solid #e3dfd5;
            background: #fff;
        }
        .calendar-weekday {
            padding: 8px 10px;
            font-size: 0.78em;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #69756f;
            background: #faf9f6;
            border-right: 1px solid #e3dfd5;
            border-bottom: 1px solid #e3dfd5;
            text-align: center;
        }
        .calendar-cell {
            min-height: 108px;
            padding: 6px 6px 8px;
            border-right: 1px solid #e3dfd5;
            border-bottom: 1px solid #e3dfd5;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .calendar-cell.outside {
            background: #faf9f6;
        }
        .calendar-cell.outside .calendar-date {
            color: #b7bdb5;
        }
        .calendar-cell.today {
            background: #eaf5f3;
        }
        .calendar-date {
            font-size: 0.85em;
            font-weight: 600;
            color: #1b211f;
            align-self: flex-start;
        }
        .calendar-cell.today .calendar-date {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #1c7a73;
            color: #fff;
        }
        .appt-chip {
            display: block;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 0.72em;
            line-height: 1.3;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .appt-chip.status-pending { background: #faf0dc; color: #a3700f; }
        .appt-chip.status-confirmed { background: #e5f3ea; color: #276b47; }
        .appt-chip.status-cancelled { background: #f8e7e2; color: #a13a24; text-decoration: line-through; }
        .appt-more {
            font-size: 0.7em;
            color: #69756f;
            padding: 0 6px;
        }
        @media (max-width: 768px) {
            .calendar-weekday { font-size: 0.65em; padding: 6px 2px; }
            .calendar-cell { min-height: 84px; }
        }
    </style>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Appointment Calendar</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
        <div th:replace="~{fragments/nav :: back}"></div>

        <div class="calendar-toolbar">
            <div class="calendar-nav">
                <a class="btn btn-outline-secondary btn-sm"
                   th:href="@{/appointment/calendar(year=${prevYear}, month=${prevMonth})}">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <a class="btn btn-outline-secondary btn-sm"
                   th:href="@{/appointment/calendar(year=${todayYear}, month=${todayMonth})}">Today</a>
                <a class="btn btn-outline-secondary btn-sm"
                   th:href="@{/appointment/calendar(year=${nextYear}, month=${nextMonth})}">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </div>
            <h2 th:text="${monthLabel}"></h2>
            <a class="btn btn-outline-secondary btn-sm" href="/appointment">
                <i class="fas fa-list"></i> List View
            </a>
        </div>

        <div class="calendar-legend">
            <span><span class="dot" style="background:#a3700f;"></span>Pending</span>
            <span><span class="dot" style="background:#276b47;"></span>Confirmed</span>
            <span><span class="dot" style="background:#a13a24;"></span>Cancelled</span>
        </div>

        <div class="calendar-grid">
            <div class="calendar-weekday">Sun</div>
            <div class="calendar-weekday">Mon</div>
            <div class="calendar-weekday">Tue</div>
            <div class="calendar-weekday">Wed</div>
            <div class="calendar-weekday">Thu</div>
            <div class="calendar-weekday">Fri</div>
            <div class="calendar-weekday">Sat</div>

            <th:block th:each="week : ${weeks}">
                <div class="calendar-cell"
                     th:each="day : ${week}"
                     th:classappend="${(day.inMonth ? '' : 'outside') + (day.today ? ' today' : '')}">
                    <span class="calendar-date" th:text="${day.date.dayOfMonth}"></span>

                    <button type="button" class="appt-chip view-appointment-btn"
                            th:each="appt, iter : ${day.appointments}"
                            th:if="${iter.index < 3}"
                            th:classappend="'status-' + ${appt.status.name().toLowerCase()}"
                            th:attr="data-appointment-id=${appt.appointmentId}"
                            th:text="${#temporals.format(appt.preferredTime, 'hh:mm a') + ' ' + appt.client.fullName}">
                    </button>

                    <div class="appt-more" th:if="${#lists.size(day.appointments) > 3}"
                         th:text="${'+' + (#lists.size(day.appointments) - 3) + ' more'}"></div>
                </div>
            </th:block>
        </div>
    </main>
</div>

<!-- The chip fetches the same markup /appointment/{id} renders and drops it in here, instead of
     navigating away from the calendar - reuses the exact same fragment as the full page and the
     /appointment list's "View" button (see AppointmentController.showAppointmentModal). -->
<div class="modal fade" id="apptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Appointment Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="apptModalBody">
                <div class="text-center text-muted py-4">Loading...</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const apptModalEl = document.getElementById('apptModal');
        const apptModalBody = document.getElementById('apptModalBody');
        const apptModal = new bootstrap.Modal(apptModalEl);

        document.querySelectorAll('.view-appointment-btn').forEach(function (chip) {
            chip.addEventListener('click', function () {
                apptModalBody.innerHTML = '<div class="text-center text-muted py-4">Loading...</div>';
                apptModal.show();
                fetch('/appointment/' + chip.getAttribute('data-appointment-id') + '/modal')
                    .then(function (res) { return res.text(); })
                    .then(function (html) { apptModalBody.innerHTML = html; })
                    .catch(function () {
                        apptModalBody.innerHTML = '<div class="text-danger text-center py-4">Failed to load appointment details.</div>';
                    });
            });
        });
    });
</script>
</body>
</html>
