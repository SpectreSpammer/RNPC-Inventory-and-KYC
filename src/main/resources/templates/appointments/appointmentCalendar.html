<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Appointment Calendar - RNPC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/card :: card-styles}"></th:block>
    <th:block th:replace="~{fragments/stat-card :: stat-card-styles}"></th:block>
    <th:block th:replace="~{fragments/table-card :: table-card-styles}"></th:block>
    <th:block th:replace="~{fragments/page-header :: page-header-styles}"></th:block>
    <th:block th:replace="~{fragments/status-badge :: badge-styles}"></th:block>
    <th:block th:replace="~{fragments/empty-state :: empty-state-styles}"></th:block>
    <th:block th:replace="~{fragments/appointment-ui :: styles}"></th:block>
<style>
    .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-4);}
    .calendar-toolbar h2{margin:0;font-size:20px;font-weight:700;color:var(--text);}
    .calendar-nav{display:flex;align-items:center;gap:var(--space-2);}
    .calendar-legend{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-3);font-size:13px;color:var(--text-muted);}
    .calendar-legend .dot{display:inline-block;width:var(--space-2);height:var(--space-2);border-radius:50%;margin-right:var(--space-2);}
    .dot-pending{background:var(--amber);}.dot-confirmed{background:var(--green);}.dot-cancelled{background:var(--red);}
    .appointment-calendar-card{overflow-x:auto;}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:700px;border-top:1px solid var(--border);border-left:1px solid var(--border);background:var(--bg-card);}
    .calendar-weekday{padding:var(--space-2);font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-muted);background:var(--bg-page);border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;}
    .calendar-cell{min-height:120px;padding:var(--space-2);border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:var(--space-1);min-width:0;}
    .calendar-cell.outside{background:var(--bg-page);}.calendar-cell.outside .calendar-date{color:var(--text-muted);}.calendar-cell.today{background:var(--accent-subtle);}
    .calendar-date{font-size:13px;font-weight:600;color:var(--text);align-self:flex-start;}
    .calendar-cell.today .calendar-date{display:grid;place-items:center;width:var(--space-5);height:var(--space-5);border-radius:50%;background:var(--accent);color:var(--bg-card);}
    .appt-chip{display:block;width:100%;border:none;text-align:left;font-size:12px;line-height:1.4;padding:var(--space-1);border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .appt-chip.status-pending{background:var(--amber-subtle);color:var(--amber);}.appt-chip.status-confirmed{background:var(--green-subtle);color:var(--green);}.appt-chip.status-cancelled{background:var(--red-subtle);color:var(--red);text-decoration:line-through;}
    .appt-more{font-size:11px;color:var(--text-muted);padding:0 var(--space-1);}
</style>
</head>
<body class="appointment-page">
<div th:replace="~{fragments/layout-app :: sidebar(active='calendar', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>
<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>
    <main class="content appointment-content">
<div class="appointment-heading">
    <div th:replace="~{fragments/page-header :: header(title='Appointment Calendar', subtitle='Review the shop appointment schedule.', actions=null)}"></div>
    <a class="btn-accent-sm" href="/appointment/create"><i data-feather="plus"></i>Schedule an Appointment</a>
</div>
<div class="card appointment-calendar-card">
        <div class="calendar-toolbar">
            <div class="calendar-nav">
                <a class="table-action"
                   th:href="@{/appointment/calendar(year=${prevYear}, month=${prevMonth})}">
                    <i data-feather="chevron-left"></i><span class="visually-hidden">Previous month</span>
                </a>
                <a class="table-action"
                   th:href="@{/appointment/calendar(year=${todayYear}, month=${todayMonth})}">Today</a>
                <a class="table-action"
                   th:href="@{/appointment/calendar(year=${nextYear}, month=${nextMonth})}">
                    <i data-feather="chevron-right"></i><span class="visually-hidden">Next month</span>
                </a>
            </div>
            <h2 th:text="${monthLabel}"></h2>
            <a class="table-action" href="/appointment">
                <i data-feather="list"></i> List View
            </a>
        </div>

        <div class="calendar-legend">
            <span><span class="dot dot-pending"></span>Pending</span>
            <span><span class="dot dot-confirmed"></span>Confirmed</span>
            <span><span class="dot dot-cancelled"></span>Cancelled</span>
        </div>

        <div class="calendar-grid">
            <div class="calendar-weekday">Sun</div>
            <div class="calendar-weekday">Mon</div>
            <div class="calendar-weekday">Tue</div>
            <div class="calendar-weekday">Wed</div>
            <div class="calendar-weekday">Thu</div>
            <div class="calendar-weekday">Fri</div>
            <div class="calendar-weekday">Sat</div>

            <th:block th:each="week : ${weeks}">
                <div class="calendar-cell"
                     th:each="day : ${week}"
                     th:classappend="${(day.inMonth ? '' : 'outside') + (day.today ? ' today' : '')}">
                    <span class="calendar-date" th:text="${day.date.dayOfMonth}"></span>

                    <button type="button" class="appt-chip search-result-link"
                            th:each="appt, iter : ${day.appointments}"
                            th:if="${iter.index < 3}"
                            th:classappend="'status-' + ${appt.status.name().toLowerCase()}"
                            th:attr="data-entity-type='APPOINTMENT', data-entity-id=${appt.appointmentId}"
                            th:text="${#temporals.format(appt.preferredTime, 'hh:mm a') + ' ' + appt.client.fullName}">
                    </button>

                    <div class="appt-more" th:if="${#lists.size(day.appointments) > 3}"
                         th:text="${'+' + (#lists.size(day.appointments) - 3) + ' more'}"></div>
                </div>
            </th:block>
        </div>

</div>
    </main>
</div>
<div th:replace="~{fragments/appointment-ui :: receiptFeedback}"></div>
<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<th:block th:replace="~{fragments/appointment-ui :: script}"></th:block>

</body>
</html>
