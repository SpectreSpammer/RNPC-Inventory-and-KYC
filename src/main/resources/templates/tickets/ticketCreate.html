<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create ticket - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/tickets.css}"/>
</head>
<body class="pf-page tickets-page">

<!--
  Two columns (Client | Job order) on one pf-split section, matching
  gpt/admin/"Create walk-in ticket@1x.png" - the mockup's only form on this shell that puts two
  whole sections side by side rather than stacking them, so pf-split/pf-split-col are a new layout
  variant in parts-form.css. Each column is a plain field stack (no pf-grid inside it), unlike the
  two-up field grid parts forms already use - see parts-form.css's comment on pf-split.

  Back to tickets (@{/ticket/view}) rather than /repair, though both render the same admin listing -
  /ticket/view is the one under this feature's own path, matching the sidebar's "View Tickets".

  The header fragment always renders a code badge and the literal text "Back to parts" - same
  trade-off batch 4 accepted for the client forms rather than special-casing the shared fragment -
  so this gets a "TKT" badge and that text rather than "Back to tickets".
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='new-ticket', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='TKT', title='Create ticket', subtitle='Log a walk-in repair and hand the customer a job order slip.', backUrl=@{/ticket/view})}"></div>

            <form th:action="@{/ticket/create}" th:object="${ticketDto}" method="post">
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section pf-split">
                        <div class="pf-split-col">
                            <h2>Client</h2>
                            <div class="pf-field">
                                <label for="fullName">Full name</label>
                                <input type="text" th:field="*{fullName}" id="fullName" placeholder="Enter the client's full name"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="contactNumber">Contact number</label>
                                <input type="text" th:field="*{contactNumber}" data-phone-format inputmode="tel" id="contactNumber" placeholder="e.g. 0917 234 5678"/>
                                <span class="pf-hint">If this number already belongs to a client, the ticket is linked to them instead of creating a new one.</span>
                                <span class="pf-error" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="email">Email <span class="pf-optional">(optional)</span></label>
                                <input type="email" th:field="*{email}" id="email" placeholder="Enter email address"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="address">Address <span class="pf-optional">(optional)</span></label>
                                <textarea th:field="*{address}" id="address" rows="3" placeholder="House number, street, barangay, city"></textarea>
                                <span class="pf-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                            </div>
                        </div>

                        <div class="pf-split-col">
                            <h2>Job order</h2>
                            <div class="pf-field">
                                <label for="deviceType">Device type</label>
                                <select th:field="*{deviceType}" id="deviceType">
                                    <option value="">Select device type</option>
                                    <option value="Cellphone">Cellphone</option>
                                    <option value="Laptop">Laptop</option>
                                    <option value="Desktop">Desktop</option>
                                </select>
                                <span class="pf-error" th:if="${#fields.hasErrors('deviceType')}" th:errors="*{deviceType}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="brand">Brand <span class="pf-optional">(optional)</span></label>
                                <input type="text" th:field="*{brand}" id="brand" placeholder="e.g. Acer"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="modelName">Model name</label>
                                <input type="text" th:field="*{modelName}" id="modelName" placeholder="e.g. Aspire 5"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="serialNumber">Serial number <span class="pf-optional">(optional)</span></label>
                                <input type="text" th:field="*{serialNumber}" id="serialNumber" placeholder="Enter serial number"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="issueDescription">Reported issue</label>
                                <textarea th:field="*{issueDescription}" id="issueDescription" rows="3" placeholder="What the customer says is wrong"></textarea>
                                <span class="pf-error" th:if="${#fields.hasErrors('issueDescription')}" th:errors="*{issueDescription}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="estimatedCost">Estimated cost <span class="pf-optional">(optional)</span></label>
                                <div class="pf-prefix">
                                    <span>Php</span>
                                    <input type="number" th:field="*{estimatedCost}" id="estimatedCost" step="0.01" min="0"/>
                                </div>
                                <span class="pf-error" th:if="${#fields.hasErrors('estimatedCost')}" th:errors="*{estimatedCost}"></span>
                            </div>
                        </div>
                    </section>

                    <p class="pf-hint pf-form-note">The job order number is assigned automatically after saving. Status starts as Pending and is updated from Repairs.</p>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/ticket/view}, saveLabel='Create ticket')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<script th:src="@{/js/phone-format.js}"></script>
</body>
</html>
