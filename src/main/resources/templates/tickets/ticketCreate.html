<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Create Ticket</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>

    <form action="#" th:action="@{/ticket/create}" th:object="${ticketDto}" method="post">

        <div class="row">
            <div class="col-md-6">
                <h5 class="text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.05em;">Client</h5>
                <hr class="mt-1"/>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" id="fullName" placeholder="Enter client's full name">
                    <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label for="contactNumber" class="form-label">Contact Number</label>
                    <input type="text" th:field="*{contactNumber}" class="form-control" id="contactNumber" placeholder="e.g. 0917 234 5678">
                    <div class="text-danger" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></div>
                    <div class="form-text">If this number already belongs to a client, the ticket is linked to that client instead of creating a new one.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Enter email address">
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea th:field="*{address}" class="form-control" id="address" rows="2"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
            </div>

            <div class="col-md-6">
                <h5 class="text-muted text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.05em;">Job Order</h5>
                <hr class="mt-1"/>

                <div class="mb-3">
                    <label for="deviceType" class="form-label">Device Type</label>
                    <select th:field="*{deviceType}" class="form-select" id="deviceType">
                        <option value="">Select device type</option>
                        <option value="Cellphone">Cellphone</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('deviceType')}" th:errors="*{deviceType}"></div>
                </div>

                <div class="mb-3">
                    <label for="brand" class="form-label">Brand</label>
                    <input type="text" th:field="*{brand}" class="form-control" id="brand" placeholder="Enter brand">
                    <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                </div>

                <div class="mb-3">
                    <label for="modelName" class="form-label">Model Name</label>
                    <input type="text" th:field="*{modelName}" class="form-control" id="modelName" placeholder="Enter model name">
                    <div class="text-danger" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
                </div>

                <div class="mb-3">
                    <label for="serialNumber" class="form-label">Serial Number <span class="text-muted">(optional)</span></label>
                    <input type="text" th:field="*{serialNumber}" class="form-control" id="serialNumber" placeholder="Enter serial number">
                    <div class="text-danger" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></div>
                </div>

                <div class="mb-3">
                    <label for="issueDescription" class="form-label">Reported Issue</label>
                    <textarea th:field="*{issueDescription}" class="form-control" id="issueDescription" rows="3"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('issueDescription')}" th:errors="*{issueDescription}"></div>
                </div>

                <div class="mb-3">
                    <label for="estimatedCost" class="form-label">Estimated Cost <span class="text-muted">(optional)</span></label>
                    <div class="input-group">
                        <span class="input-group-text">Php</span>
                        <input type="number" th:field="*{estimatedCost}" class="form-control" id="estimatedCost" step="0.01" min="0">
                    </div>
                    <div class="text-danger" th:if="${#fields.hasErrors('estimatedCost')}" th:errors="*{estimatedCost}"></div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="form-text mb-3">The job order number is assigned automatically after saving. Status starts as <strong>Pending</strong> and is updated later from Repair History.</div>
            </div>
        </div>

        <div class="row">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Create Ticket</button>
            </div>
            <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" href="/repair" role="button">Cancel</a>
            </div>
        </div>

    </form>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>
</body>
</html>
