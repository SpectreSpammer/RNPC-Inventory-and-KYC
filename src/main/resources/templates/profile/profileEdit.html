<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Edit Profile</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div th:if="${saved}" class="alert alert-success">Profile updated.</div>

            <form action="#" th:action="@{/profile/edit}" th:object="${profileDto}" method="post">

                <div class="mb-3" th:if="${isAdmin}">
                    <label class="form-label">Employee ID</label>
                    <input type="text" class="form-control" th:value="${employeeId}" readonly disabled>
                </div>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" id="fullName" placeholder="Enter your full name">
                    <div class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    <div class="form-text">Shown as your greeting on the home page.</div>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea th:field="*{address}" class="form-control" id="address" rows="2"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label for="contactNumber" class="form-label">Contact Number</label>
                    <div class="input-group">
                        <input type="text" th:field="*{contactNumber}" class="form-control" id="contactNumber" placeholder="e.g. 0917 234 5678" autocomplete="off">
                        <button type="button" class="btn btn-outline-secondary" id="toggleContactNumber" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></div>
                    <div class="form-text">Digits 5-9 are hidden until you click the eye icon.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <input type="text" th:field="*{email}" class="form-control" id="email" autocomplete="off">
                        <button type="button" class="btn btn-outline-secondary" id="toggleEmail" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    <div class="form-text">The middle of the address is hidden until you click the eye icon.</div>
                </div>

                <div class="row">
                    <div class="offset-sm-4 col-sm-4 d-grid">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                    <div class="col-sm-4 d-grid">
                        <a class="btn btn-outline-primary" href="/" role="button">Cancel</a>
                    </div>
                </div>

            </form>
        </div>
    </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Masks characters 5-9 (1-indexed) of a phone number, e.g. "09171234567" -> "0917•••••67".
        function maskPhone(value) {
            if (!value) return value;
            var chars = value.split('');
            for (var i = 4; i <= 8 && i < chars.length; i++) {
                if (chars[i] !== ' ') chars[i] = '•';
            }
            return chars.join('');
        }

        // Shows the first character and last 4 characters of the local part (before @), masks
        // everything in between, and always shows the full domain.
        function maskEmail(value) {
            if (!value || value.indexOf('@') === -1) return value;
            var atIndex = value.indexOf('@');
            var local = value.substring(0, atIndex);
            var domain = value.substring(atIndex);
            if (local.length <= 5) {
                return local.charAt(0) + '•'.repeat(Math.max(local.length - 1, 0)) + domain;
            }
            var first = local.charAt(0);
            var last4 = local.substring(local.length - 4);
            var middleLength = local.length - 1 - 4;
            return first + '•'.repeat(middleLength) + last4 + domain;
        }

        function setupMaskedField(inputId, toggleId, maskFn) {
            var input = document.getElementById(inputId);
            var toggle = document.getElementById(toggleId);
            var icon = toggle.querySelector('i');
            var realValue = input.value;
            var revealed = false;

            // The field is read-only while masked (so the garbled placeholder can never be typed
            // into by accident) and only becomes editable once revealed via the eye icon.
            function render() {
                input.value = revealed ? realValue : maskFn(realValue);
                input.readOnly = !revealed;
                icon.className = revealed ? 'fas fa-eye-slash' : 'fas fa-eye';
            }
            render();

            input.addEventListener('input', function () {
                if (revealed) realValue = input.value;
            });

            toggle.addEventListener('click', function () {
                revealed = !revealed;
                render();
                if (revealed) input.focus();
            });

            // Whatever is currently in the field at submit time is what gets sent - make sure
            // it's the real value even if the field was left masked (and therefore read-only).
            input.closest('form').addEventListener('submit', function () {
                input.readOnly = false;
                input.value = realValue;
            });
        }

        setupMaskedField('contactNumber', 'toggleContactNumber', maskPhone);
        setupMaskedField('email', 'toggleEmail', maskEmail);
    });
</script>
</body>
</html>
