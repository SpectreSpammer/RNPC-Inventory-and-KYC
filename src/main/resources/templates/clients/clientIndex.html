<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Clients</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>
    <div class="row mb-3">
        <div class="col-md-3 mb-3">
            <a class="btn btn-primary w-50" href="/client/create">Create Client</a>
        </div>
        <div class="col-md-9">
            <div class="input-group rounded">
                <input type="search" class="form-control rounded" id="nameSearch" placeholder="Search by name" aria-label="Search" aria-describedby="search-addon" />
                <span class="input-group-text border-0" id="search-addon">
                <i class="fas fa-search"></i>
            </span>
            </div>
        </div>
    </div>

    <table class="table" id="clientsTable">
        <thead>
        <tr>
            <th>Id</th>
            <th>Full Name</th>
            <th>Contact Number</th>
            <th>Email</th>
            <th>Address</th>
            <th>Ticket Number</th>
            <th>Created At</th>
            <th>Image</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- Thymeleaf iteration to populate table rows -->
        <tr th:each="person : ${client}">
            <td th:text="${person.clientId}"></td>
            <td th:text="${person.fullName}"></td>
            <td th:text="${person.contactNumber}"></td>
            <td th:text="${person.email}"></td>
            <td th:text="${person.address}"></td>
            <td th:text="${#strings.isEmpty(ticketNumbers.get(person.clientId))} ? '—' : ${ticketNumbers.get(person.clientId)}"></td>
            <td th:text="${#dates.format(person.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <img th:if="${person.imageFileName}"
                     th:src="@{/images/{imageFileName}(imageFileName=${person.imageFileName})}"
                     class="img-fluid"
                     width="180px"/>
            </td>
            <td style="white-space:nowrap">
                <a class="btn btn-secondary btn-sm"
                   th:href="@{/repair(clientId=${person.clientId})}">Repairs
                </a>
                <a class="btn btn-secondary btn-sm"
                   th:href="@{/order(clientId=${person.clientId})}">Orders
                </a>
                <a class="btn btn-primary btn-sm"
                   th:href="@{/client/edit/{id} (id=${person.clientId})}">Edit
                </a>
                <!-- Replace the delete link with a form -->
                <form th:action="@{/client/delete/{id}(id=${person.clientId})}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit"
                            class="btn btn-danger btn-sm delete-client-btn"
                            th:attr="data-repair-count=${repairCounts.get(person.clientId)}">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.delete-client-btn').forEach(function(btn) {
            btn.addEventListener('click', function(event) {
                const repairCount = parseInt(btn.dataset.repairCount, 10) || 0;
                const message = repairCount > 0
                    ? 'This client has ' + repairCount + ' repair record(s). Deleting this client will also permanently delete their repair history. Are you sure you want to delete it?'
                    : 'Are you sure you want to delete this client?';
                if (!confirm(message)) {
                    event.preventDefault();
                }
            });
        });

        const nameSearch = document.getElementById('nameSearch');
        const table = document.getElementById('clientsTable');
        const rows = table.getElementsByTagName('tr');

        nameSearch.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            for (let i = 1; i < rows.length; i++) {
                const nameCell = rows[i].getElementsByTagName('td')[1];
                if (nameCell) {
                    const nameText = nameCell.textContent || nameCell.innerText;
                    if (nameText.toLowerCase().indexOf(filter) > -1) {
                        rows[i].style.display = '';
                    } else {
                        rows[i].style.display = 'none';
                    }
                }
            }
        });
    });
</script>
</body>
</html>
