<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit client - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/parts-form :: assets}"></th:block>
</head>
<body class="pf-page clients-page">

<!--
  Same shape as clientCreate.html, differing only in the action, the _method=put field, the photo
  section (current photo + Remove photo, via the shared parts-form fragments) and the save label.
  This template previously had no shell at all - no sidebar, no topbar, a bare centered Bootstrap
  form - so this is its first time on layout-app.

  Duplicate-number rejection (ClientController.rejectDuplicateNumber) excludes this client's own id,
  so saving with the number the client already has is not treated as a clash with itself.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active='customers', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="pf-wrap">
            <div th:replace="~{fragments/parts-form :: header(code='CLI', title=${#strings.isEmpty(clientDto.fullName) ? 'Edit client' : 'Edit ' + clientDto.fullName}, subtitle='Changes apply to the Customers list as soon as you save.', backUrl=@{/client})}"></div>

            <form th:action="@{/client/update/{id}(id=${clientId})}" th:object="${clientDto}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="_method" value="put"/>
                <th:block th:if="${#fields.hasAnyErrors()}">
                    <div th:replace="~{fragments/parts-form :: errors(messages=${#fields.allErrors()})}"></div>
                </th:block>

                <div class="pf-card">

                    <section class="pf-section">
                        <h2>Client details</h2>
                        <div class="pf-grid">
                            <div class="pf-field">
                                <label for="fullName">Full name</label>
                                <input type="text" th:field="*{fullName}" id="fullName" placeholder="Enter the client's full name"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="contactNumber">Contact number</label>
                                <input type="text" th:field="*{contactNumber}" data-phone-format inputmode="tel" id="contactNumber" placeholder="e.g. 0917 234 5678"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></span>
                            </div>
                            <div class="pf-field">
                                <label for="email">Email <span class="pf-optional">(optional)</span></label>
                                <input type="email" th:field="*{email}" id="email" placeholder="Enter email address"/>
                                <span class="pf-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>
                            <div class="pf-field pf-full">
                                <label for="address">Address <span class="pf-optional">(optional)</span></label>
                                <textarea th:field="*{address}" id="address" rows="3" placeholder="House number, street, barangay, city"></textarea>
                                <span class="pf-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                            </div>
                        </div>
                    </section>

                    <section class="pf-section">
                        <h2>Photo or ID <span class="pf-optional">(optional)</span></h2>
                        <div class="pf-upload">
                            <span class="pf-upload-icon"><i data-feather="image"></i></span>
                            <div class="pf-upload-text">
                                <strong th:text="${currentImage} ? 'Replace the current photo or ID' : 'Choose a photo or ID for this client'"></strong>
                                <small class="pf-hint">PNG or JPG, up to 5 MB. Used to confirm identity on pickup.</small>
                                <input type="file" th:field="*{imageFile}" id="imageFile" accept="image/png,image/jpeg"/>
                            </div>
                        </div>
                        <span class="pf-error" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></span>
                        <th:block th:if="${currentImage}">
                            <div th:replace="~{fragments/parts-form :: current-photo(currentImage=${currentImage}, removeUrl=@{/client/removePhoto/{id}(id=${clientId})})}"></div>
                        </th:block>
                    </section>

                    <p class="pf-hint pf-form-note">The contact number is how walk-in tickets are matched to an existing client.</p>

                    <div th:replace="~{fragments/parts-form :: actions(cancelUrl=@{/client}, saveLabel='Save changes')}"></div>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>
<script th:src="@{/js/phone-format.js}"></script>
<script th:replace="~{fragments/parts-form :: remove-photo-script}"></script>
</body>
</html>
