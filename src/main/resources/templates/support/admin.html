<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Support Tickets - RNPC</title><th:block th:replace="~{fragments/layout-app :: assets}"></th:block><th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block><th:block th:replace="~{fragments/card :: card-styles}"></th:block><th:block th:replace="~{fragments/table-card :: table-card-styles}"></th:block><th:block th:replace="~{fragments/empty-state :: empty-state-styles}"></th:block><th:block th:replace="~{fragments/appointment-ui :: styles}"></th:block><link rel="stylesheet" th:href="@{/css/support.css}"/></head><body class="appointment-page support-page">
<div th:replace="~{fragments/layout-app :: sidebar(active='support', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>
<div class="main"><div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
<div th:replace="~{fragments/layout-app :: notifDetailModal}"></div><main class="content">
<header class="support-heading"><span><i data-feather="headphones"></i></span><div><h1>Support Tickets</h1><p>Review customer enquiries, reply, and update their status.</p></div></header><section class="card"><div class="card-head"><div class="card-head-left"><span class="card-icon card-icon-blue"><i data-feather="clipboard"></i></span><h2 class="card-title">Customer Support Tickets</h2></div></div><div class="support-table"><table class="rn-table" th:unless="${#lists.isEmpty(tickets)}"><thead><tr><th>Ticket #</th><th th:if="${navIsAdmin}">Customer</th><th>Subject</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>
<tr th:each="ticket : ${tickets}"><td th:text="${ticket.reference}"></td><td th:if="${navIsAdmin}" th:text="${ticket.user.username}"></td><td th:text="${ticket.topic.label}"></td><td><span class="support-status" th:classappend="${ticket.status.name()}" th:text="${ticket.status.label}"></span></td><td th:text="${#temporals.format(ticket.createdAt,'MMM d, yyyy')}"></td><td><a class="table-action search-result-link" data-entity-type="SUPPORT_TICKET" th:attr="data-entity-id=${ticket.id}" th:href="@{/support/tickets/{id}(id=${ticket.id})}"><i data-feather="eye"></i>View</a></td></tr>
</tbody></table></div><th:block th:if="${#lists.isEmpty(tickets)}"><div th:replace="~{fragments/empty-state :: state(icon='file-text',message='No support tickets yet',actions=null)}"></div></th:block></section></main></div><div th:replace="~{fragments/appointment-ui :: receiptFeedback}"></div>
<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block><th:block th:replace="~{fragments/layout-app :: app-script}"></th:block><th:block th:replace="~{fragments/appointment-ui :: script}"></th:block>
</body></html>
