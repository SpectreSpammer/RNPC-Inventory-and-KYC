<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .notif-item {
            display: block;
            padding: 14px 16px;
            border: 1px solid #e3dfd5;
            border-left: 4px solid #cfc9ba;
            border-radius: 6px;
            margin-bottom: 10px;
            text-decoration: none;
            color: #1b211f;
            background: #fff;
        }
        .notif-item:hover {
            box-shadow: 0 2px 10px -4px rgba(27,33,31,0.18);
            color: #1b211f;
        }
        .notif-item.unread {
            border-left-color: #1c7a73;
            background: #f3faf9;
        }
        .notif-message {
            font-size: 0.95em;
        }
        .notif-time {
            font-size: 0.78em;
            color: #8b958f;
            margin-top: 4px;
        }
        .notif-empty {
            color: #8b958f;
            text-align: center;
            padding: 40px 0;
        }
        .notif-item {
            cursor: pointer;
            width: 100%;
            text-align: left;
            font: inherit;
        }
        .notif-item:disabled {
            cursor: default;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Notifications</h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>

    <div th:if="${#lists.isEmpty(notifications)}" class="notif-empty">
        <i class="fas fa-bell-slash fa-2x mb-2"></i>
        <div>No notifications yet.</div>
    </div>

    <div th:each="notif : ${notifications}">
        <button type="button" class="notif-item" th:classappend="${!notif.read} ? 'unread' : ''"
                th:disabled="${notif.entityType == null or notif.entityId == null}"
                th:attr="data-entity-type=${notif.entityType},data-entity-id=${notif.entityId}">
            <div class="notif-message" th:text="${notif.message}"></div>
            <div class="notif-time" th:text="${#dates.format(notif.createdAt, 'MMM dd, yyyy hh:mm a')}"></div>
        </button>
    </div>

    <!-- Shared detail modal - populated via JS from whichever notification was clicked, fetching
         that record's own card fragment instead of navigating away from this list. -->
    <div class="modal fade" id="notifDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="notifDetailModalBody">
                    <div class="text-center text-muted py-4">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="requestReceiptSentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center py-4">
                    Request receipt message has been sent
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var modalEl = document.getElementById('notifDetailModal');
        var modalBody = document.getElementById('notifDetailModalBody');
        var modal = new bootstrap.Modal(modalEl);
        var fragmentUrls = { ORDER: '/order/', REPAIR: '/repair/', APPOINTMENT: '/appointment/' };

        document.querySelectorAll('.notif-item').forEach(function (btn) {
            if (btn.disabled) return;
            btn.addEventListener('click', function () {
                var type = btn.getAttribute('data-entity-type');
                var id = btn.getAttribute('data-entity-id');
                var base = fragmentUrls[type];
                if (!base) return;

                modalBody.innerHTML = '<div class="text-center text-muted py-4">Loading...</div>';
                modal.show();
                fetch(base + id + '/modal')
                    .then(function (res) { return res.text(); })
                    .then(function (html) { modalBody.innerHTML = html; })
                    .catch(function () {
                        modalBody.innerHTML = '<div class="text-danger text-center py-4">Failed to load details.</div>';
                    });
            });
        });

        var requestReceiptSentModal = new bootstrap.Modal(document.getElementById('requestReceiptSentModal'));
        // Delegated: the button lives inside modalBody's fetched HTML, which doesn't exist yet
        // when this listener is attached (see fetch above).
        modalBody.addEventListener('click', function (e) {
            var btn = e.target.closest('.request-receipt-btn');
            if (!btn) return;
            fetch(btn.getAttribute('data-request-receipt-url'), { method: 'PUT' })
                .then(function (res) {
                    if (res.ok) {
                        requestReceiptSentModal.show();
                    }
                });
        });
    });
</script>
</body>
</html>
