<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${ticketMode == true} ? 'Tickets - RN PC' : 'Repair History - RN PC'">Repair History - RN PC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/card :: card-styles}"></th:block>
    <th:block th:replace="~{fragments/stat-card :: stat-card-styles}"></th:block>
    <th:block th:replace="~{fragments/table-card :: table-card-styles}"></th:block>
    <th:block th:replace="~{fragments/page-header :: page-header-styles}"></th:block>
    <th:block th:replace="~{fragments/status-badge :: badge-styles}"></th:block>
    <th:block th:replace="~{fragments/empty-state :: empty-state-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/customer-repairs.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin-repairs.css}"/>
</head>
<body class="rp-page">

<!--
  The ADMIN repair list (repairs batch A1), matching gpt/admin/"Admin - Repair list@1x.png" and
  "Admin - Ticket list ( ticket view)@1x.png". It is one template in two modes: /repair serves it
  with ticketMode=false, /ticket/view with ticketMode=true (the Tickets wording, the New Ticket
  button, "Ticket #" / "Received" headers and the Tickets > View Tickets sidebar item). Customers
  never get it: RepairRecordController returns customerRepairIndex.html to them, and
  TicketController sends a non-admin on /ticket/view to /repair.

  Built like the customer page: the rows are rendered here, once, so the existing money and
  status-badge fragments are used as they are, and the page script filters, sorts and counts from
  ALL_REPAIRS (the serialized AdminRepairView list) by hiding / reordering those rows by data-id -
  it never builds a row. Its styling is the customer page's own customer-repairs.css (stat cards,
  toolbar, table, footer) plus admin-repairs.css for what only the admin has.

  The six stat cards are buttons because they toggle a filter - stat-card.html renders only a static
  card or a link - so stat-card-styles is reused and the markup is bespoke. card.html /
  table-card.html / empty-state.html take content via cross-file ~{::#id} expressions, so their
  classes are reproduced directly.
-->

<div th:replace="~{fragments/layout-app :: sidebar(active=${ticketMode == true ? 'view-ticket' : 'repairs'}, currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content" th:with="noun=${ticketMode == true ? 'ticket' : 'repair'}">
        <div class="rn-page-header">
            <div class="rn-page-header-text">
                <h1 class="rn-page-header-title"
                    th:text="${ticketMode == true} ? (${client != null} ? ${client.fullName} + ' - Tickets' : 'Tickets') : (${client != null} ? ${client.fullName} + ' - Repair History' : 'Repair History')"></h1>
                <p class="rn-page-header-subtitle"
                   th:text="${ticketMode == true} ? 'Every job order logged at the shop, with its current status.' : 'Track your device repairs and their current status.'"></p>
            </div>
            <div class="rn-page-header-actions">
                <a th:if="${isAdmin and client != null}" href="/client" class="table-action">Back to Clients</a>
                <a th:if="${isAdmin and client != null and ticketMode != true}" href="/repair" class="table-action">View All Repairs</a>
                <a th:if="${isAdmin and client != null and ticketMode == true}" href="/ticket/view" class="table-action">View All Tickets</a>
                <th:block th:if="${isAdmin}">
                    <a th:if="${ticketMode == true}" class="btn-accent-sm ra-primary" th:href="@{/ticket/create}">
                        <i data-feather="plus"></i>New Ticket
                    </a>
                    <a th:unless="${ticketMode == true}" class="btn-accent-sm ra-primary"
                       th:href="${client == null} ? @{/repair/create} : @{/repair/create(clientId=${client.clientId})}">
                        <i data-feather="plus"></i>Add Repair
                    </a>
                </th:block>
            </div>
        </div>

        <section class="rp-stats" aria-label="Filter by status"
                 th:with="pendingCount=${#lists.size(repairViews.?[status == 'PENDING'])},
                          inProgressCount=${#lists.size(repairViews.?[status == 'IN_PROGRESS'])},
                          completedCount=${#lists.size(repairViews.?[status == 'COMPLETED'])},
                          releasedCount=${#lists.size(repairViews.?[status == 'RELEASED'])},
                          cancelledCount=${#lists.size(repairViews.?[status == 'CANCELLED'])}">
            <button type="button" class="stat-card stat-card-link rp-stat is-active" data-status="" aria-pressed="true">
                <div class="stat-top">
                    <span class="stat-icon stat-icon-blue"><i data-feather="clipboard"></i></span>
                    <i data-feather="chevron-right" class="stat-chevron"></i>
                </div>
                <p class="stat-label" th:text="${ticketMode == true} ? 'Total Tickets' : 'Total Repairs'">Total Repairs</p>
                <p class="stat-value" th:text="${#lists.size(repairViews)}"></p>
            </button>
            <button type="button" class="stat-card stat-card-link rp-stat" data-status="PENDING" aria-pressed="false">
                <div class="stat-top">
                    <span class="stat-icon stat-icon-orange"><i data-feather="clock"></i></span>
                    <i data-feather="chevron-right" class="stat-chevron"></i>
                </div>
                <p class="stat-label">Pending</p>
                <p class="stat-value" th:text="${pendingCount}"></p>
            </button>
            <button type="button" class="stat-card stat-card-link rp-stat" data-status="IN_PROGRESS" aria-pressed="false">
                <div class="stat-top">
                    <span class="stat-icon stat-icon-purple"><i data-feather="tool"></i></span>
                    <i data-feather="chevron-right" class="stat-chevron"></i>
                </div>
                <p class="stat-label">In Progress</p>
                <p class="stat-value" th:text="${inProgressCount}"></p>
            </button>
            <button type="button" class="stat-card stat-card-link rp-stat" data-status="COMPLETED" aria-pressed="false">
                <div class="stat-top">
                    <span class="stat-icon stat-icon-green"><i data-feather="check-square"></i></span>
                    <i data-feather="chevron-right" class="stat-chevron"></i>
                </div>
                <p class="stat-label">Completed</p>
                <p class="stat-value" th:text="${completedCount}"></p>
            </button>
            <button type="button" class="stat-card stat-card-link rp-stat" data-status="RELEASED" aria-pressed="false">
                <div class="stat-top">
                    <span class="stat-icon stat-icon-green"><i data-feather="check-circle"></i></span>
                    <i data-feather="chevron-right" class="stat-chevron"></i>
                </div>
                <p class="stat-label">Released</p>
                <p class="stat-value" th:text="${releasedCount}"></p>
            </button>
            <button type="button" class="stat-card stat-card-link rp-stat" data-status="CANCELLED" aria-pressed="false">
                <div class="stat-top">
                    <span class="stat-icon stat-icon-gray"><i data-feather="x-circle"></i></span>
                    <i data-feather="chevron-right" class="stat-chevron"></i>
                </div>
                <p class="stat-label">Cancelled</p>
                <p class="stat-value" th:text="${cancelledCount}"></p>
            </button>
        </section>

        <div class="rp-toolbar">
            <label class="rp-search">
                <i data-feather="search"></i>
                <input type="search" id="rpSearch" aria-label="Search"
                       th:placeholder="${ticketMode == true} ? 'Search by ticket number, client, device or issue' : 'Search by client, device, issue or job order'"/>
            </label>
            <label class="rp-field">
                <span>Device</span>
                <select id="rpDevice">
                    <option value="">All devices</option>
                    <option value="Cellphone">Cellphone</option>
                    <option value="Laptop">Laptop</option>
                    <option value="Desktop">Desktop</option>
                </select>
            </label>
            <label class="rp-field">
                <span>Status</span>
                <select id="rpStatus">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="RELEASED">Released</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </label>
            <div class="rp-dates">
                <input type="date" id="rpFrom" aria-label="Date from"/>
                <span>to</span>
                <input type="date" id="rpTo" aria-label="Date to"/>
            </div>
        </div>

        <div class="rp-toolbar rp-toolbar-sort">
            <label class="rp-field">
                <span>Sort by</span>
                <select id="rpSort">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="status">Status</option>
                    <option value="client">Client name</option>
                    <option value="cost">Cost high to low</option>
                </select>
            </label>
            <button type="button" class="rp-clear" id="rpClear" hidden>Clear filters</button>
        </div>

        <div th:if="${#lists.isEmpty(repairViews)}" class="card">
            <div th:replace="~{fragments/empty-state :: state(icon='tool', message=${ticketMode == true ? 'No tickets yet' : 'No repairs on record yet'}, actions=null)}"></div>
        </div>

        <div th:unless="${#lists.isEmpty(repairViews)}" class="card">
            <div class="card-head">
                <div class="card-head-left">
                    <span class="card-icon card-icon-blue"><i data-feather="tool"></i></span>
                    <h2 class="card-title" th:text="${ticketMode == true} ? 'Tickets' : 'Repairs'">Repairs</h2>
                </div>
            </div>
            <table class="rn-table" id="rpTable">
                <thead>
                <tr>
                    <th th:text="${ticketMode == true} ? 'Ticket #' : 'Ref #'">Ref #</th>
                    <th th:if="${client == null}">Client</th>
                    <th>Device</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th th:text="${ticketMode == true} ? 'Received' : 'Date of repair'">Date of repair</th>
                    <th>Cost</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="rpBody">
                <tr th:each="v : ${repairViews}" class="rp-row" th:attr="data-id=${v.id}">
                    <td th:text="${v.jobOrderNumber}"></td>
                    <td th:if="${client == null}">
                        <a th:href="@{/repair(clientId=${v.clientId})}" class="card-link" th:text="${v.clientName}"></a>
                    </td>
                    <td th:text="${v.deviceLabel}"></td>
                    <td th:text="${v.issue}"></td>
                    <td><span th:replace="~{fragments/status-badge :: badge(status=${v.statusEnum})}"></span></td>
                    <td th:text="${v.date}"></td>
                    <td>
                        <th:block th:if="${v.costAssessed}">
                            <span th:replace="~{fragments/money :: amount(amount=${v.cost})}"></span>
                            <small th:if="${!#strings.isEmpty(v.costSuffix)}" class="rp-muted" th:text="${v.costSuffix}"></small>
                        </th:block>
                        <span th:unless="${v.costAssessed}" class="rp-muted" th:text="${v.costPlaceholder}"></span>
                    </td>
                    <td>
                        <div class="ra-actions">
                            <a class="table-action" th:href="@{/repair/edit/{id}(id=${v.id})}"><i data-feather="edit-2"></i>Edit</a>
                            <form th:action="@{/repair/delete/{id}(id=${v.id})}" method="post" class="table-action-form">
                                <input type="hidden" name="_method" value="delete"/>
                                <button type="submit" class="table-action" onclick="return confirm('Are you sure?')"><i data-feather="trash-2"></i>Delete</button>
                            </form>
                            <button type="button" class="table-action rp-view" th:attr="data-repair-id=${v.id}, aria-label=${'View ' + noun}">
                                <i data-feather="eye"></i>View
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="rp-empty" id="rpEmpty" hidden th:text="'No ' + ${noun} + 's match these filters.'">No repairs match these filters.</div>
            <div class="rp-footer" id="rpFooter" th:attr="data-noun=${noun}"
                 th:text="${#lists.size(repairViews)} + ' ' + ${noun} + '(s) total'"></div>
        </div>
    </main>
</div>

<!-- The details modal. Its header and X live here; the body is the admin repairCard fragment
     (repairs/repairDetail.html), fetched from /repair/{id}/modal, which ends with its own Edit
     repair and Close buttons so the same fragment also works inside layout-app's shared
     notification modal. -->
<div class="modal fade" id="repairDetailModal" tabindex="-1" aria-labelledby="repairDetailTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="repairDetailTitle">Repair details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="repairDetailModalBody"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>

<script th:inline="javascript">/*<![CDATA[*/
var ALL_REPAIRS = /*[[${repairViews}]]*/ [];
/*]]>*/</script>
<script th:inline="none">
document.addEventListener('DOMContentLoaded', function () {
    var el = function (id) { return document.getElementById(id); };
    var VALID_STATUSES = ['PENDING', 'IN_PROGRESS', 'COMPLETED', 'RELEASED', 'CANCELLED'];

    var search = el('rpSearch'), device = el('rpDevice'), status = el('rpStatus');
    var from = el('rpFrom'), to = el('rpTo'), sort = el('rpSort');
    var clear = el('rpClear'), footer = el('rpFooter'), empty = el('rpEmpty'), body = el('rpBody');
    var cards = Array.prototype.slice.call(document.querySelectorAll('.rp-stat'));
    var noun = footer ? footer.getAttribute('data-noun') : 'repair';

    var rows = {};
    Array.prototype.forEach.call(document.querySelectorAll('.rp-row'), function (row) {
        rows[row.getAttribute('data-id')] = row;
    });

    function matches(r) {
        var term = search.value.trim().toLowerCase();
        if (term && r.searchText.indexOf(term) === -1) { return false; }
        if (device.value && r.deviceType !== device.value) { return false; }
        if (status.value && r.status !== status.value) { return false; }
        if (from.value && !(r.dateIso && r.dateIso >= from.value)) { return false; }
        if (to.value && !(r.dateIso && r.dateIso <= to.value)) { return false; }
        return true;
    }

    function newestFirst(a, b) { return (b.dateEpoch - a.dateEpoch) || (b.id - a.id); }

    function comparator() {
        switch (sort.value) {
            case 'oldest': return function (a, b) { return (a.dateEpoch - b.dateEpoch) || (a.id - b.id); };
            case 'status': return function (a, b) { return (a.statusRank - b.statusRank) || newestFirst(a, b); };
            case 'client': return function (a, b) {
                return a.clientSortKey.localeCompare(b.clientSortKey) || newestFirst(a, b);
            };
            case 'cost':   return function (a, b) { return (b.cost - a.cost) || newestFirst(a, b); };
            default:       return newestFirst;
        }
    }

    function filtersActive() {
        return !!(search.value.trim() || device.value || status.value || from.value || to.value);
    }

    function apply() {
        var shown = ALL_REPAIRS.filter(matches).sort(comparator());
        var showing = {};
        shown.forEach(function (r) { showing[r.id] = true; });

        // Reorder by re-appending in sorted order, then hide whatever is filtered out.
        shown.forEach(function (r) { if (rows[r.id]) { body.appendChild(rows[r.id]); } });
        ALL_REPAIRS.forEach(function (r) { if (rows[r.id]) { rows[r.id].hidden = !showing[r.id]; } });

        var active = filtersActive();
        footer.textContent = active
            ? 'Showing ' + shown.length + ' of ' + ALL_REPAIRS.length + ' ' + noun + '(s)'
            : ALL_REPAIRS.length + ' ' + noun + '(s) total';
        empty.hidden = shown.length !== 0;
        clear.hidden = !active;

        cards.forEach(function (card) {
            var on = card.getAttribute('data-status') === status.value;
            card.classList.toggle('is-active', on);
            card.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
    }

    // A card filters the table to its status; the active card (other than Total) clears it again.
    cards.forEach(function (card) {
        card.addEventListener('click', function () {
            if (!hasRows) { return; }
            var wanted = card.getAttribute('data-status');
            status.value = (wanted && wanted === status.value) ? '' : wanted;
            apply();
        });
    });

    // With no rows at all the table, footer and empty message are not on the page, so there is
    // nothing for the toolbar to drive.
    var hasRows = Object.keys(rows).length > 0;
    if (hasRows) {
        search.addEventListener('input', apply);
        [device, status, from, to, sort].forEach(function (c) { c.addEventListener('change', apply); });

        clear.addEventListener('click', function () {
            search.value = ''; device.value = ''; status.value = ''; from.value = ''; to.value = '';
            apply();
        });
    }

    // The details modal: fetch the admin fragment for this repair.
    Array.prototype.forEach.call(document.querySelectorAll('.rp-view'), function (btn) {
        btn.addEventListener('click', function () {
            fetch('/repair/' + btn.getAttribute('data-repair-id') + '/modal')
                .then(function (res) { return res.text(); })
                .then(function (html) {
                    el('repairDetailModalBody').innerHTML = html;
                    if (window.feather) { feather.replace(); }
                    bootstrap.Modal.getOrCreateInstance(el('repairDetailModal')).show();
                });
        });
    });

    // /repair?status=IN_PROGRESS, /ticket/view?status=PENDING etc. - an unknown value is ignored,
    // same as no parameter.
    var initial = new URLSearchParams(window.location.search).get('status');
    if (initial && VALID_STATUSES.indexOf(initial) > -1) { status.value = initial; }

    if (hasRows) { apply(); }
});
</script>

</body>
</html>
