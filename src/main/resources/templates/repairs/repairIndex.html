<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Repair History - RNPC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/card :: card-styles}"></th:block>
    <th:block th:replace="~{fragments/stat-card :: stat-card-styles}"></th:block>
    <th:block th:replace="~{fragments/table-card :: table-card-styles}"></th:block>
    <th:block th:replace="~{fragments/page-header :: page-header-styles}"></th:block>
    <th:block th:replace="~{fragments/status-badge :: badge-styles}"></th:block>
    <th:block th:replace="~{fragments/empty-state :: empty-state-styles}"></th:block>
    <style>
        /*
          Converted from gpt/User Interface.png's "Repair History" panel (layout only - see chat):
          page-header, 4 stat cards, a filter row (search/status/date-range), a table card with
          muted uppercase headers, pagination-style footer. No approved page-specific mockup
          exists beyond that low-res panel, so exact spacing below matches this app's own
          established card/table/stat-card fragment classes instead of the mockup's pixel values.

          card.html/table-card.html/empty-state.html's content/action params are cross-file
          ~{::#id} fragment expressions (see dashboard.html/savedBuilds.html for the same note) -
          not called from here for that reason; direct markup below reproduces their classes.

          This same view serves both the signed-in customer's own Repair History AND the admin's
          all-repairs / per-client drill-down (RepairRecordController.showRepairList) - restyled
          in place, no behavior removed: isAdmin/linkClientName/client/clientId are the exact same
          model attributes the old template used, just re-skinned.
        */
        .content{ padding:var(--space-5); }

        .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); margin-bottom:var(--space-5); }
        @media (max-width:1150px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }

        .filter-row{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-4); }
        .repair-search{
            display:flex; align-items:center; gap:var(--space-2); background:var(--bg-card); border:1px solid var(--border);
            border-radius:999px; padding:9px var(--space-4); flex:1; min-width:220px;
        }
        .repair-search svg{ width:15px; height:15px; color:var(--text-muted); flex-shrink:0; }
        .repair-search input{ border:none; background:none; outline:none; font-size:13px; color:var(--text); width:100%; }
        .filter-select{
            border:1px solid var(--border); background:var(--bg-card); border-radius:var(--radius-sm); padding:8px 12px;
            font-size:12.5px; font-weight:600; color:var(--text);
        }
        .filter-date-range{ display:flex; align-items:center; gap:6px; }
        .filter-date-range input{
            border:1px solid var(--border); background:var(--bg-card); border-radius:var(--radius-sm); padding:8px 10px;
            font-size:12.5px; color:var(--text);
        }
        .filter-date-sep{ color:var(--text-muted); font-size:12.5px; }

        .repair-footer{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); margin-top:var(--space-3); font-size:12.5px; color:var(--text-muted); }

        /* Lets the delete form sit inline next to the Edit link in the Action cell, same as the
           old template's style="display:inline" did - as a class instead, per the no-inline-
           styles rule. */
        .table-action-form{ display:inline; }

        .no-search-results{ display:none; text-align:center; padding:var(--space-6) var(--space-4); color:var(--text-muted); font-size:13.5px; font-weight:600; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout-app :: sidebar(active='repairs', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="rn-page-header">
            <div class="rn-page-header-text">
                <h1 class="rn-page-header-title"
                    th:text="${client != null} ? ${client.fullName} + ' - Repair History' : 'Repair History'"></h1>
                <p class="rn-page-header-subtitle">Track your device repairs and their current status.</p>
            </div>
            <div class="rn-page-header-actions">
                <a th:if="${isAdmin and client != null}" href="/client" class="table-action">Back to Clients</a>
                <a th:if="${isAdmin and client != null}" href="/repair" class="table-action">View All Repairs</a>
                <a th:if="${isAdmin}" class="btn-accent-sm"
                   th:href="${client == null} ? @{/repair/create} : @{/repair/create(clientId=${client.clientId})}">
                    <i data-feather="plus"></i>Add Repair
                </a>
            </div>
        </div>

        <section class="stat-grid"
                  th:with="pendingCount=${#lists.size(repairs.?[status.name() == 'PENDING'])},
                            inProgressCount=${#lists.size(repairs.?[status.name() == 'IN_PROGRESS'])},
                            releasedCount=${#lists.size(repairs.?[status.name() == 'RELEASED'])}">
            <div th:replace="~{fragments/stat-card :: stat(icon='clipboard', color='blue', label='Total Repairs', value=${#lists.size(repairs)}, trend=null, trendDirection=null, trendLabel=null)}"></div>
            <div th:replace="~{fragments/stat-card :: stat(icon='clock', color='orange', label='Pending', value=${pendingCount}, trend=null, trendDirection=null, trendLabel=null)}"></div>
            <div th:replace="~{fragments/stat-card :: stat(icon='tool', color='purple', label='In Progress', value=${inProgressCount}, trend=null, trendDirection=null, trendLabel=null)}"></div>
            <div th:replace="~{fragments/stat-card :: stat(icon='check-circle', color='green', label='Released', value=${releasedCount}, trend=null, trendDirection=null, trendLabel=null)}"></div>
        </section>

        <div class="filter-row">
            <div class="repair-search">
                <i data-feather="search"></i>
                <input type="search" id="repairSearchInput" placeholder="Search by device, issue, or reference number..." aria-label="Search repairs"/>
            </div>
            <select class="filter-select" id="repairStatusFilter" aria-label="Filter by status">
                <option value="">All Statuses</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
                <option value="RELEASED">Released</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
            <div class="filter-date-range">
                <input type="date" id="repairDateFrom" aria-label="Repair date from"/>
                <span class="filter-date-sep">to</span>
                <input type="date" id="repairDateTo" aria-label="Repair date to"/>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(repairs)}" class="card">
            <div th:replace="~{fragments/empty-state :: state(icon='tool', message='No repairs on record yet', actions=null)}"></div>
        </div>

        <div th:unless="${#lists.isEmpty(repairs)}" class="card">
            <div class="card-head">
                <div class="card-head-left">
                    <span class="card-icon card-icon-blue"><i data-feather="tool"></i></span>
                    <h2 class="card-title">Repairs</h2>
                </div>
            </div>
            <table class="rn-table" id="repairsTable">
                <thead>
                <tr>
                    <th>Ref #</th>
                    <th th:if="${isAdmin and client == null}">Client</th>
                    <th>Device</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th>Date of Repair</th>
                    <th>Cost</th>
                    <th th:if="${isAdmin}">Action</th>
                    <th>View</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="repair : ${repairs}" class="repair-row"
                    th:attr="data-status=${repair.status.name()}, data-repair-date=${#dates.format(repair.repairDate, 'yyyy-MM-dd')}">
                    <td th:text="${repair.jobOrderNumber}"></td>
                    <td th:if="${isAdmin and client == null}">
                        <a th:href="@{/repair(clientId=${repair.client.clientId})}" class="card-link" th:text="${repair.client.fullName}"></a>
                    </td>
                    <td th:text="${repair.deviceType} + ' (' + ${repair.brand} + ' ' + ${repair.modelName} + ')'"></td>
                    <td th:text="${repair.issueDescription}"></td>
                    <td><span th:replace="~{fragments/status-badge :: badge(status=${repair.status})}"></span></td>
                    <td th:text="${#dates.format(repair.repairDate, 'MMM dd, yyyy')}"></td>
                    <td th:insert="~{fragments/money :: amount(amount=${repair.cost})}"></td>
                    <td th:if="${isAdmin}">
                        <a class="table-action" th:href="@{/repair/edit/{id}(id=${repair.repairId})}"><i data-feather="edit-2"></i>Edit</a>
                        <form th:action="@{/repair/delete/{id}(id=${repair.repairId})}" method="post" class="table-action-form">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="table-action" onclick="return confirm('Are you sure?')"><i data-feather="trash-2"></i>Delete</button>
                        </form>
                    </td>
                    <td>
                        <button type="button" class="table-action view-repair-btn" th:attr="data-repair-id=${repair.repairId}">
                            <i data-feather="eye"></i>View
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="repair-footer">
                <!-- No server-side pagination exists (RepairRecordController.showRepairList
                     returns the full list every time) - this states the real total rather than
                     the mockup's "Showing 1-4 of 8" paging text, which would be invented. -->
                <span th:text="${#lists.size(repairs)} + ' repair(s) total'"></span>
            </div>
            <div class="no-search-results" id="noSearchResults">No repairs match your filters.</div>
        </div>
    </main>
</div>

<!-- View modal - same fragment/endpoint the old template's admin-only detail flow already had
     available (RepairRecordController.showRepairModal already allows the repair's own linked
     customer, not just admin - see chat), now exposed as a real button for everyone instead of
     unused by this page. Mirrors orders/orderIndex.html's identical View-modal pattern. -->
<div class="modal fade" id="repairDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Repair Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="repairDetailModalBody"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.view-repair-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            fetch('/repair/' + btn.getAttribute('data-repair-id') + '/modal')
                .then(function (res) { return res.text(); })
                .then(function (html) {
                    document.getElementById('repairDetailModalBody').innerHTML = html;
                    if (window.feather) { feather.replace(); }
                    bootstrap.Modal.getOrCreateInstance(document.getElementById('repairDetailModal')).show();
                });
        });
    });

    const searchInput = document.getElementById('repairSearchInput');
    const statusFilter = document.getElementById('repairStatusFilter');
    const dateFrom = document.getElementById('repairDateFrom');
    const dateTo = document.getElementById('repairDateTo');
    const rows = Array.from(document.querySelectorAll('.repair-row'));
    const noResults = document.getElementById('noSearchResults');

    function applyFilters() {
        const term = searchInput.value.trim().toLowerCase();
        const status = statusFilter.value;
        const from = dateFrom.value;
        const to = dateTo.value;
        let visibleCount = 0;

        rows.forEach(function (row) {
            const matchesText = !term || row.textContent.toLowerCase().indexOf(term) > -1;
            const matchesStatus = !status || row.getAttribute('data-status') === status;
            const rowDate = row.getAttribute('data-repair-date');
            const matchesFrom = !from || (rowDate && rowDate >= from);
            const matchesTo = !to || (rowDate && rowDate <= to);
            const visible = matchesText && matchesStatus && matchesFrom && matchesTo;
            row.hidden = !visible;
            if (visible) visibleCount++;
        });

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    if (rows.length > 0) {
        searchInput.addEventListener('input', applyFilters);
        statusFilter.addEventListener('change', applyFilters);
        dateFrom.addEventListener('change', applyFilters);
        dateTo.addEventListener('change', applyFilters);
    }
});
</script>

</body>
</html>
