<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        .slip { max-width: 420px; margin: 0 auto; border: 1px solid #dee2e6; border-radius: 10px; padding: 24px; }
        .slip-head { text-align: center; border-bottom: 1px dashed #adb5bd; padding-bottom: 12px; margin-bottom: 12px; }
        .slip-row { display: flex; justify-content: space-between; padding: 3px 0; }
        .slip-row .k { color: #6c757d; }
        .slip-row .v { font-weight: 500; text-align: right; }
        .slip-section { margin-bottom: 14px; }
        .slip-section .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6c757d; font-weight: 600; margin-bottom: 4px; }
        .slip-divider { border-top: 1px dashed #adb5bd; margin: 14px 0; }
        .slip-sign { display: flex; gap: 20px; margin-top: 24px; }
        .slip-sign div { flex: 1; text-align: center; }
        .slip-sign .line { border-top: 1px solid #adb5bd; height: 28px; margin-bottom: 4px; }
        .slip-sign span { font-size: 0.7rem; color: #6c757d; }
        @media print {
            body * { visibility: hidden; }
            #ticketPrintModalBody, #ticketPrintModalBody * { visibility: visible; }
            #ticketPrintModalBody { position: absolute; top: 0; left: 0; width: 100%; }
            .slip { border: none; }
        }
    </style>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4" th:if="${client == null}">Repair History</h1>
        <h1 class="text-center my-4" th:if="${client != null}">
            Repair History &mdash; <span th:text="${client.fullName}"></span>
        </h1>
</div>

<div class="content-wrapper">
    <nav class="sidebar" th:replace="~{fragments/nav :: sidebar}"></nav>

    <main class="main-content">
    <div th:replace="~{fragments/nav :: back}"></div>
    <div class="row mb-3">
        <div class="col-md-3 mb-3" th:if="${isAdmin}">
            <a class="btn btn-primary w-50"
               th:href="${client == null} ? @{/repair/create} : @{/repair/create(clientId=${client.clientId})}">
                Add Repair
            </a>
        </div>
        <div class="col-md-5 mb-3" th:if="${client == null}">
            <div class="input-group rounded">
                <input type="search" class="form-control rounded" id="nameSearch" placeholder="Search by client name" aria-label="Search" aria-describedby="search-addon" />
                <span class="input-group-text border-0" id="search-addon">
                <i class="fas fa-search"></i>
            </span>
            </div>
        </div>
        <div th:class="${client == null} ? 'col-md-4 text-md-end' : 'col-md-9 text-md-end'">
            <a class="btn btn-outline-secondary" th:if="${client != null}" href="/client">Back to Clients</a>
            <a class="btn btn-outline-secondary" th:if="${client != null}" href="/repair">View All Repairs</a>
        </div>
    </div>

    <table class="table" id="repairsTable">
        <thead>
        <tr>
            <th>Job Order</th>
            <th th:if="${client == null}">Client</th>
            <th>Device</th>
            <th>Serial Number</th>
            <th>Issue</th>
            <th>Fix</th>
            <th>Recommendation</th>
            <th id="repairDateSortHeader" style="cursor:pointer; user-select:none;">Date of Repair <i class="fas fa-sort" id="repairDateSortIcon"></i></th>
            <th>Warranty Ends</th>
            <th>Status</th>
            <th>Cost</th>
            <th>Photo</th>
            <th th:if="${isAdmin}">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="repair : ${repairs}">
            <td th:text="${repair.jobOrderNumber}"></td>
            <td th:if="${client == null}" class="client-name">
                <a th:if="${linkClientName}" th:href="@{/repair(clientId=${repair.client.clientId})}" th:text="${repair.client.fullName}"></a>
                <span th:unless="${linkClientName}" th:text="${repair.client.fullName}"></span>
            </td>
            <td>
                <span th:text="${repair.deviceType}"></span> &mdash;
                <span th:text="${repair.brand}"></span>
                <span th:text="${repair.modelName}"></span>
            </td>
            <td th:text="${repair.serialNumber}"></td>
            <td th:text="${repair.issueDescription}"></td>
            <td th:text="${repair.fix}"></td>
            <td th:text="${repair.recommendation != null and !#strings.isEmpty(repair.recommendation)} ? ${repair.recommendation} : 'N/A'"></td>
            <td th:text="${#dates.format(repair.repairDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${repair.warrantyEndDate != null} ? ${#dates.format(repair.warrantyEndDate, 'yyyy-MM-dd')} : 'N/A'"></td>
            <td>
                <span class="badge"
                      th:classappend="${repair.status.name() == 'COMPLETED' or repair.status.name() == 'RELEASED'} ? 'bg-success' : (${repair.status.name() == 'CANCELLED'} ? 'bg-danger' : (${repair.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                      th:text="${repair.status}"></span>
            </td>
            <td>
                Php <span th:text="${repair.cost}"></span>
            </td>
            <td>
                <img th:if="${repair.imageFileName}"
                     th:src="@{/images/{imageFileName}(imageFileName=${repair.imageFileName})}"
                     class="img-fluid"
                     width="120px"/>
            </td>
            <td th:if="${isAdmin}" style="white-space:nowrap">
                <a class="btn btn-primary btn-sm"
                   th:href="@{/repair/edit/{id} (id=${repair.repairId})}">Edit
                </a>
                <button type="button" class="btn btn-outline-secondary btn-sm print-ticket-btn"
                        th:attr="data-repair-id=${repair.repairId}">Print
                </button>
                <form th:action="@{/repair/delete/{id}(id=${repair.repairId})}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure?')">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- The "Print" button fetches the same slip markup /ticket/{id} renders and drops it in here,
         instead of navigating away from this list - see TicketController.showTicketModal. -->
    <div class="modal fade" id="ticketPrintModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Print Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="ticketPrintModalBody">
                    <div class="text-center text-muted py-4">Loading...</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="window.print()">Print</button>
                </div>
            </div>
        </div>
    </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script th:replace="~{fragments/nav :: sidebarScript}"></script>

<script th:if="${client == null}">
    document.addEventListener('DOMContentLoaded', function() {
        const nameSearch = document.getElementById('nameSearch');
        const table = document.getElementById('repairsTable');
        const rows = table.getElementsByTagName('tr');

        nameSearch.addEventListener('input', function() {
            const filter = this.value.toLowerCase();
            for (let i = 1; i < rows.length; i++) {
                const nameCell = rows[i].getElementsByClassName('client-name')[0];
                if (nameCell) {
                    const nameText = nameCell.textContent || nameCell.innerText;
                    if (nameText.toLowerCase().indexOf(filter) > -1) {
                        rows[i].style.display = '';
                    } else {
                        rows[i].style.display = 'none';
                    }
                }
            }
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const header = document.getElementById('repairDateSortHeader');
        const icon = document.getElementById('repairDateSortIcon');
        const tableBody = document.querySelector('#repairsTable tbody');
        if (!header || !tableBody) return;

        const colIndex = header.cellIndex;
        const rows = Array.from(tableBody.querySelectorAll('tr'));
        let dir = null;

        header.addEventListener('click', function () {
            dir = dir === 'asc' ? 'desc' : 'asc';
            const sorted = rows.slice().sort(function (a, b) {
                const av = a.cells[colIndex] ? a.cells[colIndex].textContent.trim() : '';
                const bv = b.cells[colIndex] ? b.cells[colIndex].textContent.trim() : '';
                const cmp = av.localeCompare(bv);
                return dir === 'asc' ? cmp : -cmp;
            });
            sorted.forEach(function (row) { tableBody.appendChild(row); });
            icon.className = 'fas ' + (dir === 'asc' ? 'fa-sort-up' : 'fa-sort-down');
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const ticketPrintModalEl = document.getElementById('ticketPrintModal');
        const ticketPrintModalBody = document.getElementById('ticketPrintModalBody');
        const ticketPrintModal = new bootstrap.Modal(ticketPrintModalEl);

        document.querySelectorAll('.print-ticket-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                ticketPrintModalBody.innerHTML = '<div class="text-center text-muted py-4">Loading...</div>';
                ticketPrintModal.show();
                fetch('/ticket/' + btn.getAttribute('data-repair-id') + '/modal')
                    .then(function (res) { return res.text(); })
                    .then(function (html) { ticketPrintModalBody.innerHTML = html; })
                    .catch(function () {
                        ticketPrintModalBody.innerHTML = '<div class="text-danger text-center py-4">Failed to load ticket.</div>';
                    });
            });
        });
    });
</script>
</body>
</html>
