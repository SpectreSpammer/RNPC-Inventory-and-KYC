<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PC and Cellphone Repair Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/demo.css}"/>
</head>
<body>
<div class="container">
        <h1 class="text-center my-4">Edit Repair Record</h1>
    <form th:action="@{/repair/update/{id}(id=${repairId})}" th:object="${repairRecordDto}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="_method" value="put"/>

        <div class="mb-3">
            <label for="clientId" class="form-label">Client</label>
            <select th:field="*{clientId}" class="form-select" id="clientId">
                <option value="">Select a client</option>
                <option th:each="c : ${clients}" th:value="${c.clientId}" th:text="${c.fullName}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Job Order Number</label>
            <input type="text" class="form-control" th:value="${jobOrderNumber}" disabled>
        </div>

        <div class="mb-3">
            <label for="deviceType" class="form-label">Device Type</label>
            <select th:field="*{deviceType}" class="form-select" id="deviceType">
                <option value="">Select device type</option>
                <option value="Cellphone">Cellphone</option>
                <option value="Laptop">Laptop</option>
                <option value="Desktop">Desktop</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('deviceType')}" th:errors="*{deviceType}"></div>
        </div>

        <div class="mb-3">
            <label for="brand" class="form-label">Brand</label>
            <input type="text" th:field="*{brand}" class="form-control" id="brand" placeholder="Enter brand">
            <div class="text-danger" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
        </div>

        <div class="mb-3">
            <label for="modelName" class="form-label">Model Name</label>
            <input type="text" th:field="*{modelName}" class="form-control" id="modelName" placeholder="Enter model name">
            <div class="text-danger" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
        </div>

        <div class="mb-3">
            <label for="serialNumber" class="form-label">Serial Number <span class="text-muted">(optional)</span></label>
            <input type="text" th:field="*{serialNumber}" class="form-control" id="serialNumber" placeholder="Enter serial number">
            <div class="text-danger" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></div>
        </div>

        <div class="mb-3">
            <label for="issueDescription" class="form-label">Issue Description</label>
            <textarea th:field="*{issueDescription}" class="form-control" id="issueDescription" rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('issueDescription')}" th:errors="*{issueDescription}"></div>
        </div>

        <div class="mb-3">
            <label for="technician" class="form-label">Technician <span class="text-muted">(optional)</span></label>
            <input type="text" th:field="*{technician}" class="form-control" id="technician" placeholder="Enter assigned technician">
            <div class="text-danger" th:if="${#fields.hasErrors('technician')}" th:errors="*{technician}"></div>
        </div>

        <div class="mb-3">
            <label for="cost" class="form-label">Cost</label>
            <div class="input-group">
                <span class="input-group-text">Php</span>
                <input type="number" th:field="*{cost}" class="form-control" id="cost" placeholder="Enter repair cost" step="0.01" min="0">
            </div>
            <div class="text-danger" th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></div>
        </div>

        <div class="mb-3">
            <label for="repairDate" class="form-label">Date of Repair</label>
            <input type="date" th:field="*{repairDate}" class="form-control" id="repairDate">
            <div class="text-danger" th:if="${#fields.hasErrors('repairDate')}" th:errors="*{repairDate}"></div>
        </div>

        <div class="mb-3">
            <label for="warrantyEndDate" class="form-label">Warranty Ends <span class="text-muted">(optional)</span></label>
            <input type="date" th:field="*{warrantyEndDate}" class="form-control" id="warrantyEndDate">
            <div class="text-danger" th:if="${#fields.hasErrors('warrantyEndDate')}" th:errors="*{warrantyEndDate}"></div>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select th:field="*{status}" class="form-select" id="status">
                <option value="">Select status</option>
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
                <option value="RELEASED">Released</option>
                <option value="CANCELLED">Cancelled</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <div class="mb-3">
            <label for="remarks" class="form-label">Remarks <span class="text-muted">(optional)</span></label>
            <textarea th:field="*{remarks}" class="form-control" id="remarks" rows="2"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}"></div>
        </div>

        <div class="mb-3">
            <label for="fix" class="form-label">Fix</label>
            <textarea th:field="*{fix}" class="form-control" id="fix" rows="2"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('fix')}" th:errors="*{fix}"></div>
        </div>

        <div class="mb-3">
            <label for="recommendation" class="form-label">Recommendation <span class="text-muted">(optional)</span></label>
            <textarea th:field="*{recommendation}" class="form-control" id="recommendation" rows="2"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('recommendation')}" th:errors="*{recommendation}"></div>
        </div>

        <div class="mb-3">
            <label for="imageFile" class="form-label">Photo for Technician Reference <span class="text-muted">(optional)</span></label>
            <input type="file" th:field="*{imageFile}" class="form-control" id="imageFile">
            <div class="text-danger" th:if="${#fields.hasErrors('imageFile')}" th:errors="*{imageFile}"></div>
            <div th:if="${currentImage}" class="mt-2">
                <img th:src="@{/images/{imageFileName}(imageFileName=${currentImage})}"
                     class="img-fluid d-block mb-2" width="180px"/>
                <button type="button" class="btn btn-outline-danger btn-sm remove-photo-btn"
                        th:attr="data-remove-url=@{/repair/removePhoto/{id}(id=${repairId})}">
                    Remove Photo
                </button>
            </div>
        </div>

        <div class="row">
            <div class="offset-sm-4 col-sm-4 d-grid">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-sm-4 d-grid">
                <a class="btn btn-outline-primary" href="/repair" role="button">Cancel</a>
            </div>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhG8x1Sk6rCthFF7P4l0sylTs9I6I0J3RYh7tPpLTU5niIt1wBcp9czwI6c" crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.remove-photo-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                if (!confirm('Remove the current photo?')) return;
                fetch(btn.dataset.removeUrl, { method: 'DELETE' })
                    .then(function() { window.location.reload(); });
            });
        });
    });
</script>
</body>
</html>
