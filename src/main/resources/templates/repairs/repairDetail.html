<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Standalone fragment only - rendered inside the notification/list modals via
     "repairs/repairDetail :: repairCard", never served as a full page of its own. -->

<!--
  The ADMIN details fragment (repairs batch A1), returned by RepairRecordController.showRepairModal
  for an admin, matching gpt/admin/"Admin - Repair details@1x.png". The customer's fragment below is
  separate and unchanged.

  It reads only `adminView` (an AdminRepairView - the one view model allowed to carry the client,
  the contact number and the shop remarks) plus nothing else, so a customer fragment can never pick
  those up by sharing it. Remarks are labelled "not shown to the client" because they are.

  Body and the Edit repair / Close buttons only - the "Repair details" header and X belong to the
  host modal (the list's own, or layout-app's shared notifDetailModal). The progress, header and
  step classes (rd-*) come from customer-repairs.css; the rest (ra-*) from admin-repairs.css. Both
  are linked here because the fragment can land on a page that loaded neither.
-->
<div class="rd ra" th:fragment="repairCard">
    <link rel="stylesheet" th:href="@{/css/customer-repairs.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin-repairs.css}"/>
    <th:block th:replace="~{fragments/status-badge :: badge-styles}"></th:block>

    <div class="rd-top">
        <div>
            <h3 class="rd-job" th:text="${adminView.jobOrderNumber}"></h3>
            <p class="rd-sentence" th:text="${adminView.statusSentence}"></p>
        </div>
        <span th:replace="~{fragments/status-badge :: badge(status=${adminView.statusEnum})}"></span>
    </div>

    <div class="ra-client">
        <span class="ra-client-item">Client <strong th:text="${adminView.clientName}"></strong></span>
        <span class="ra-client-item">Contact <strong th:text="${adminView.contact.text}" th:classappend="${adminView.contact.placeholder} ? 'ra-muted'"></strong></span>
    </div>

    <ol class="rd-steps" aria-label="Repair progress">
        <li th:each="step : ${adminView.steps}" th:classappend="${step.done} ? 'is-done'">
            <span class="rd-step-bar"></span>
            <span class="rd-step-label" th:text="${step.label}"></span>
        </li>
    </ol>

    <div class="ra-body" th:classappend="${!adminView.hasPhoto} ? 'ra-body-no-photo'">
        <div class="ra-main">
            <dl class="ra-grid">
                <div><dt>Device</dt><dd th:text="${adminView.deviceLabel}"></dd></div>
                <div><dt>Issue</dt><dd th:text="${adminView.issue}"></dd></div>
                <div><dt>Date of repair</dt><dd th:text="${adminView.date}"></dd></div>
                <div>
                    <dt>Cost</dt>
                    <dd>
                        <th:block th:if="${adminView.costAssessed}">
                            <span th:replace="~{fragments/money :: amount(amount=${adminView.cost})}"></span>
                            <small th:if="${!#strings.isEmpty(adminView.costSuffix)}" class="ra-muted" th:text="${adminView.costSuffix}"></small>
                        </th:block>
                        <span th:unless="${adminView.costAssessed}" class="ra-muted" th:text="${adminView.costPlaceholder}"></span>
                    </dd>
                </div>
                <div><dt>Technician</dt><dd th:text="${adminView.technician.text}" th:classappend="${adminView.technician.placeholder} ? 'ra-muted'"></dd></div>
                <div><dt>Warranty</dt><dd th:text="${adminView.warranty.text}" th:classappend="${adminView.warranty.placeholder} ? 'ra-muted'"></dd></div>
            </dl>
            <hr class="ra-rule"/>
            <dl class="ra-grid">
                <div><dt>What was done</dt><dd th:text="${adminView.fix.text}" th:classappend="${adminView.fix.placeholder} ? 'ra-muted'"></dd></div>
                <div><dt>Recommendation</dt><dd th:text="${adminView.recommendation.text}" th:classappend="${adminView.recommendation.placeholder} ? 'ra-muted'"></dd></div>
            </dl>
            <hr class="ra-rule"/>
            <dl class="ra-grid ra-grid-one">
                <div>
                    <dt>Shop remarks <span class="ra-dt-note">(not shown to the client)</span></dt>
                    <dd class="ra-remarks" th:text="${adminView.remarks.text}" th:classappend="${adminView.remarks.placeholder} ? 'ra-muted'"></dd>
                </div>
            </dl>
        </div>

        <!--/* Only when the repair has a photo; with none, the whole block is left out. */-->
        <div class="ra-photo" th:if="${adminView.hasPhoto}">
            <p class="ra-label">Photo from the technician</p>
            <img th:src="@{/images/{f}(f=${adminView.photoFile})}" alt="Photo of the device from the technician"/>
        </div>
    </div>

    <div class="ra-footer">
        <a class="ra-edit" th:href="@{/repair/edit/{id}(id=${adminView.id})}">Edit repair</a>
        <button type="button" class="ra-close" data-bs-dismiss="modal">Close</button>
    </div>
</div>

<!--
  The CUSTOMER details fragment (repairs batch U1), returned by RepairRecordController
  .showRepairModal when the signed-in user is not an admin, matching gpt/User/"Customer - Repair
  details@1x.png". The admin fragment above is unchanged.

  It reads ONLY `view` (a RepairView) plus `repair.status` for the shared status pill - never
  repair.remarks, and never the client's name or phone. Remarks are internal; the rule is
  structural as well as by convention, because RepairView has no remarks field.

  Body and a Close button only - the "Repair details" header and its X belong to whichever modal
  hosts this: the list page's own modal, or layout-app's shared notifDetailModal when it is opened
  from a notification, the dashboard or search. Because the fragment can land on a page that never
  loaded customer-repairs.css or the badge styles, it pulls in both itself.
-->
<div class="rd" th:fragment="customerRepairCard">
    <link rel="stylesheet" th:href="@{/css/customer-repairs.css}"/>
    <th:block th:replace="~{fragments/status-badge :: badge-styles}"></th:block>

    <div class="rd-top">
        <div>
            <h3 class="rd-job" th:text="${view.jobOrderNumber}"></h3>
            <p class="rd-sentence" th:text="${view.statusSentence}"></p>
        </div>
        <span th:replace="~{fragments/status-badge :: badge(status=${repair.status})}"></span>
    </div>

    <ol class="rd-steps" aria-label="Repair progress">
        <li th:each="step : ${view.steps}" th:classappend="${step.done} ? 'is-done'">
            <span class="rd-step-bar"></span>
            <span class="rd-step-label" th:text="${step.label}"></span>
        </li>
    </ol>

    <div class="rd-body" th:classappend="${!view.hasPhoto} ? 'rd-body-no-photo'">
        <dl class="rd-details">
            <div><dt>Device</dt><dd th:text="${view.deviceLabel}"></dd></div>
            <div><dt>Issue</dt><dd th:text="${view.issue}"></dd></div>
            <div><dt>Date of repair</dt><dd th:text="${view.date}"></dd></div>
            <div>
                <dt>Cost</dt>
                <dd class="rd-cost">
                    <th:block th:if="${view.costAssessed}">
                        <span th:replace="~{fragments/money :: amount(amount=${view.cost})}"></span>
                        <small th:if="${!#strings.isEmpty(view.costSuffix)}" class="rd-muted" th:text="${view.costSuffix}"></small>
                    </th:block>
                    <span th:unless="${view.costAssessed}" class="rd-muted" th:text="${view.costPlaceholder}"></span>
                </dd>
            </div>
            <div><dt>Technician</dt><dd th:text="${view.technician.text}" th:classappend="${view.technician.placeholder} ? 'rd-muted'"></dd></div>
            <div><dt>Warranty</dt><dd th:text="${view.warranty.text}" th:classappend="${view.warranty.placeholder} ? 'rd-muted'"></dd></div>
            <hr class="rd-rule"/>
            <div><dt>What was done</dt><dd th:text="${view.fix.text}" th:classappend="${view.fix.placeholder} ? 'rd-muted'"></dd></div>
            <div><dt>Recommendation</dt><dd th:text="${view.recommendation.text}" th:classappend="${view.recommendation.placeholder} ? 'rd-muted'"></dd></div>
        </dl>

        <!--/* Only when the repair has a photo; with none, the whole block is left out. */-->
        <div class="rd-photo" th:if="${view.hasPhoto}">
            <p class="rd-label">Photo from the technician</p>
            <img th:src="@{/images/{f}(f=${view.photoFile})}" alt="Photo of the device from the technician"/>
        </div>
    </div>

    <div class="rd-footer">
        <button type="button" class="rd-close" data-bs-dismiss="modal">Close</button>
    </div>
</div>
</body>
</html>
