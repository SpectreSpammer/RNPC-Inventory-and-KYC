<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Order Summary - RNPC</title>
    <th:block th:replace="~{fragments/layout-app :: assets}"></th:block>
    <th:block th:replace="~{fragments/layout-app :: app-styles}"></th:block>
    <th:block th:replace="~{fragments/card :: card-styles}"></th:block>
    <th:block th:replace="~{fragments/stat-card :: stat-card-styles}"></th:block>
    <th:block th:replace="~{fragments/table-card :: table-card-styles}"></th:block>
    <th:block th:replace="~{fragments/page-header :: page-header-styles}"></th:block>
    <th:block th:replace="~{fragments/status-badge :: badge-styles}"></th:block>
    <th:block th:replace="~{fragments/empty-state :: empty-state-styles}"></th:block>
    <style>
        /*
          Customer-only split of the old combined orders/orderIndex.html (see chat) - converted to
          this app's shared design system the same way repairs/repairIndex.html was; the admin half
          of the old page now lives, unconverted, at orders/adminOrderIndex.html.

          card.html/table-card.html/empty-state.html's content/action params are cross-file
          ~{::#id} fragment expressions (see dashboard.html/repairIndex.html for the same note) -
          not called from here for that reason; direct markup below reproduces their classes.

          Status column: status-badge.html's badge(status) fragment can't be reused for the
          buildStage case - its switch has no cases for BuildStage's enum values, and adding them
          would need a per-order fulfilmentMethod-dependent label for READY that a fixed per-case
          fragment string can't express; extending its signature to pass that through would also
          force updating every other page that already calls badge() (including dashboard.html,
          which this task must not touch). So the buildStage badge below is built directly with
          the same .badge-pill classes status-badge-styles already defines, with its text supplied
          by the controller's buildStageLabels map (see OrderController) rather than a T(...) call,
          per the DevTools stale-class failure already hit with T(...) on the admin page. The plain
          order-status case still calls the real fragment, unchanged.
        */
        .content{ padding:var(--space-5); }

        .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4); margin-bottom:var(--space-5); }
        @media (max-width:1150px){ .stat-grid{ grid-template-columns:repeat(2,1fr); } }

        .filter-row{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-4); }
        .order-search{
            display:flex; align-items:center; gap:var(--space-2); background:var(--bg-card); border:1px solid var(--border);
            border-radius:999px; padding:9px var(--space-4); flex:1; min-width:220px;
        }
        .order-search svg{ width:15px; height:15px; color:var(--text-muted); flex-shrink:0; }
        .order-search input{ border:none; background:none; outline:none; font-size:13px; color:var(--text); width:100%; }
        .filter-select{
            border:1px solid var(--border); background:var(--bg-card); border-radius:var(--radius-sm); padding:8px 12px;
            font-size:12.5px; font-weight:600; color:var(--text);
        }

        .order-footer{ display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); margin-top:var(--space-3); font-size:12.5px; color:var(--text-muted); }
        .text-muted-sm{ color:var(--text-muted); font-size:11.5px; }
        .table-action-form{ display:inline; }
        .no-search-results{ display:none; text-align:center; padding:var(--space-6) var(--space-4); color:var(--text-muted); font-size:13.5px; font-weight:600; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout-app :: sidebar(active='orders', currentUsername=${currentUsername}, currentRole=${currentRole})}"></div>

<div class="main">
    <div th:replace="~{fragments/layout-app :: topbar(currentUsername=${currentUsername}, currentRole=${currentRole}, unreadNotifications=${unreadNotifications}, recentNotifications=${recentNotifications})}"></div>
    <div th:replace="~{fragments/layout-app :: notifDetailModal}"></div>

    <main class="content">
        <div class="rn-page-header">
            <div class="rn-page-header-text">
                <h1 class="rn-page-header-title">Order Summary</h1>
                <p class="rn-page-header-subtitle">View and manage your recent orders.</p>
            </div>
        </div>

        <section class="stat-grid">
            <div th:replace="~{fragments/stat-card :: stat(icon='clipboard', color='blue', label='Total Orders', value=${#lists.size(orders)}, footerIcon='package', footerText=${activeOrderCount + (activeOrderCount == 1 ? ' active order' : ' active orders')}, href=null)}"></div>
            <div th:replace="~{fragments/stat-card :: stat(icon='check-circle', color='green', label='Paid', value=${paidOrderCount}, footerIcon='clock', footerText=${'Awaiting payment: ' + awaitingPaymentCount}, href=null)}"></div>
            <div th:replace="~{fragments/stat-card :: stat(icon='tool', color='orange', label='In Progress', value=${inProgressOrderCount}, footerIcon='settings', footerText=${mostAdvancedStageLabel != null ? mostAdvancedStageLabel : 'None in progress'}, href=null)}"></div>
            <div th:replace="~{fragments/stat-card :: stat(icon='dollar-sign', color='purple', label='Total Spent', value=${'Php ' + #numbers.formatDecimal(totalSpent, 1, 'COMMA', 2, 'POINT')}, footerIcon='trending-up', footerText='Lifetime', href=null)}"></div>
        </section>

        <div class="filter-row">
            <div class="order-search">
                <i data-feather="search"></i>
                <input type="search" id="orderSearchInput" placeholder="Search by item or order number..." aria-label="Search orders"/>
            </div>
            <select class="filter-select" id="orderStatusFilter" aria-label="Filter by status">
                <option value="">All Statuses</option>
                <option value="AWAITING_PAYMENT">Awaiting Payment</option>
                <option value="PAID">Paid</option>
                <option value="CANCELLATION_REQUESTED">Cancellation Requested</option>
                <option value="CANCELLED">Cancelled</option>
                <option value="ORDER_CONFIRMED">Order Confirmed</option>
                <option value="COMPONENTS_RESERVED">Components Reserved</option>
                <option value="ASSEMBLY_IN_PROGRESS">Assembly In Progress</option>
                <option value="TESTING">Testing</option>
                <option value="READY">Ready</option>
                <option value="COMPLETED">Completed</option>
            </select>
        </div>

        <div th:if="${#lists.isEmpty(orders)}" class="card">
            <div th:replace="~{fragments/empty-state :: state(icon='shopping-cart', message='No orders yet', actions=null)}"></div>
        </div>

        <div th:unless="${#lists.isEmpty(orders)}" class="card">
            <div class="card-head">
                <div class="card-head-left">
                    <span class="card-icon card-icon-blue"><i data-feather="shopping-cart"></i></span>
                    <h2 class="card-title">Orders</h2>
                </div>
            </div>
            <table class="rn-table" id="ordersTable">
                <thead>
                <tr>
                    <th>Order #</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}" class="order-row"
                    th:attr="data-status=${order.buildStage != null ? order.buildStage.name() : order.status.name()}">
                    <td th:text="${order.orderNumber}"></td>
                    <td>
                        <span th:if="${not #lists.isEmpty(order.items)}"
                              th:text="${order.items[0].brand} + ' ' + ${order.items[0].modelName}"></span>
                        <span th:if="${#lists.size(order.items) > 1}" class="text-muted-sm"
                              th:text="' +' + (${#lists.size(order.items)} - 1) + ' more items'"></span>
                    </td>
                    <td th:insert="~{fragments/money :: amount(amount=${order.totalAmount})}"></td>
                    <td th:text="${#strings.replace(order.paymentMethod.name(), '_', ' ')}"></td>
                    <td>
                        <th:block th:if="${order.buildStage == null}">
                            <span th:replace="~{fragments/status-badge :: badge(status=${order.status})}"></span>
                        </th:block>
                        <span th:if="${order.buildStage != null}" class="badge-pill"
                              th:classappend="${order.buildStage.name() == 'COMPLETED' ? 'badge-completed' : (order.buildStage.name() == 'READY' ? 'badge-confirmed' : 'badge-in-progress')}"
                              th:text="${buildStageLabels.get(order.orderId)}"></span>
                    </td>
                    <td th:text="${#dates.format(order.createdAt, 'MMM dd, yyyy')}"></td>
                    <td style="white-space:nowrap">
                        <a class="table-action search-result-link" href="/order"
                           th:attr="data-entity-type='ORDER', data-entity-id=${order.orderId}">
                            <i data-feather="eye"></i>View
                        </a>
                        <button type="button" class="table-action"
                                th:if="${order.status.name() == 'AWAITING_PAYMENT' and currentUsername != null and order.client.user != null and order.client.user.username == currentUsername}"
                                data-bs-toggle="modal" th:attr="data-bs-target='#uploadReceiptModal' + ${order.orderId}">
                            <i data-feather="upload"></i>Upload Receipt
                        </button>
                        <span th:if="${order.status.name() == 'CANCELLATION_REQUESTED'}" class="text-muted-sm">Awaiting admin approval</span>
                        <th:block th:with="cancelEligible=${order.status.name() == 'AWAITING_PAYMENT' or (order.status.name() == 'PAID' and currentUsername != null and order.client.user != null and order.client.user.username == currentUsername)}">
                            <form th:if="${cancelEligible and order.withinCancellationWindow}"
                                  th:action="@{/order/cancel/{id}(id=${order.orderId})}" method="post" class="table-action-form">
                                <input type="hidden" name="_method" value="put"/>
                                <button type="submit" class="table-action"
                                        th:attr="data-confirm-message=${order.status.name() != 'PAID'} ? 'Cancel this order?' : 'This order is already paid - your cancellation will be submitted to admin for approval before any refund is processed. Continue?'">
                                    <i data-feather="x-circle"></i>Cancel
                                </button>
                            </form>
                            <button type="button" class="table-action" disabled
                                    th:if="${cancelEligible and !order.withinCancellationWindow}"
                                    title="The 7-day warranty claim window for this order has passed">
                                <i data-feather="x-circle"></i>Cancel
                            </button>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="order-footer">
                <span th:text="${#lists.size(orders)} + ' order(s) total'"></span>
            </div>
            <div class="no-search-results" id="noSearchResults">No orders match your filters.</div>
        </div>

        <!-- One Upload Receipt modal per order - same per-order-modal pattern
             adminOrderIndex.html/repairIndex.html use for their own row-scoped modals. -->
        <th:block th:each="order : ${orders}">
            <div th:if="${order.status.name() == 'AWAITING_PAYMENT' and currentUsername != null and order.client.user != null and order.client.user.username == currentUsername}"
                 class="modal fade" th:id="'uploadReceiptModal' + ${order.orderId}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <form th:action="@{/order/uploadReceipt/{id}(id=${order.orderId})}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="_method" value="put"/>
                            <div class="modal-header">
                                <h5 class="modal-title">Upload Receipt</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <label th:for="'receiptFile' + ${order.orderId}">Receipt image for order
                                    <strong th:text="${order.orderNumber}"></strong></label>
                                <input type="file" name="receiptFile" th:id="'receiptFile' + ${order.orderId}" accept="image/*" required/>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="table-action" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn-accent-sm">Upload</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </th:block>
    </main>
</div>

<th:block th:replace="~{fragments/layout-app :: scripts}"></th:block>
<th:block th:replace="~{fragments/layout-app :: app-script}"></th:block>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function () {
    const searchInput = document.getElementById('orderSearchInput');
    const statusFilter = document.getElementById('orderStatusFilter');
    const rows = Array.from(document.querySelectorAll('.order-row'));
    const noResults = document.getElementById('noSearchResults');

    function applyFilters() {
        const term = searchInput.value.trim().toLowerCase();
        const status = statusFilter.value;
        let visibleCount = 0;

        rows.forEach(function (row) {
            const matchesText = !term || row.textContent.toLowerCase().indexOf(term) > -1;
            const matchesStatus = !status || row.getAttribute('data-status') === status;
            const visible = matchesText && matchesStatus;
            row.hidden = !visible;
            if (visible) visibleCount++;
        });

        noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    }

    if (rows.length > 0) {
        searchInput.addEventListener('input', applyFilters);
        statusFilter.addEventListener('change', applyFilters);
    }

    // Cancel confirmation - the message lives on the button's data-confirm-message (set
    // server-side per order status) rather than in an inline onclick, so no quoted JS ever has to
    // survive a Thymeleaf expression. Delegated on document because submit bubbles.
    document.addEventListener('submit', function (e) {
        const form = e.target.closest('.table-action-form');
        if (!form) { return; }
        const btn = form.querySelector('[data-confirm-message]');
        if (!btn) { return; }
        if (!confirm(btn.getAttribute('data-confirm-message'))) {
            e.preventDefault();
        }
    });
});
</script>

</body>
</html>
